.pill.SUSPECT,.pill.INJ-UNKNOWN{background:var(--warnbg);color:var(--warn)}.pill.HOLD,.pill.LOWCONF,.pill.MODEL-ONLY-LOWCONF,.pill.LOW-FLAGGED{background:var(--amberbg);color:var(--amber)}
.pill.FORWARD-TEST{background:var(--bluebg);color:var(--blue)}

.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:11px;white-space:nowrap;cursor:help}

.legend summary{cursor:pointer}
.ok{color:var(--ok)}.deg,.warn{color:var(--amber)}.bad,.fail{color:var(--warn)}.mut,.muted,.info{color:var(--mut)}.neg{color:var(--warn)}.pos{color:var(--ok)}

/* ===== Model Desk polish v1 : institutional / terminal refinement layer. Loaded LAST. Presentation only. ===== */
:root{
--bg:#070c16;--bg2:#0b1220;--card:#0f1727;--card2:#151f35;--line:#1f2c47;--line2:#2a3b5e;--ink:#e8eef9;--mut:#8b9bb9;--mut2:#6f7f9d;

 background:radial-gradient(560px 260px at 88% -70px,rgba(var(--sp-rgb),.20),transparent 72%),radial-gradient(460px 260px at -12% 14%,rgba(139,92,246,.07),transparent 70%),#070c16;background-repeat:no-repeat;overflow-x:hidden}

/* ---------- header: brand row, title, freshness, pinned nav ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:0!important;background:linear-gradient(180deg,rgba(var(--sp-rgb),.16),rgba(7,12,22,.96) 78%),#070c16!important;border:0;border-bottom:1px solid var(--line)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.pl-brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:0 0 9px;border-bottom:1px solid rgba(255,255,255,.07)}
