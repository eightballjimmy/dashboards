 const d=el('tr',null,'sub');const td=el('td');td.colSpan=12;
 const parts=[];if(g.goalies)for(const x of['away','home']){const l=g.goalies[x];if(l)parts.push(x+' goalie: '+(l.name||'?')+' ('+l.status+', '+l.source+(l.rest!=null?', rest '+l.rest+'d':'')+')')}
 if(g.model)parts.push('home win '+pc(g.model.home_win)+'; P(tied after 60) '+pc(g.model.p_reg_tie)+'; puck line home -1.5 '+pc(g.model.home_minus1_5)+', away -1.5 '+pc(g.model.away_minus1_5));
 if(g.model&&g.data_grade)parts.push('data grade '+g.data_grade+': '+((P.grade_help||{})[g.data_grade]||''));
 if(g.flags)parts.push('FLAGS: '+g.flags.join(' | '));
 td.textContent=parts.join('\n');td.style.whiteSpace='pre-wrap';d.appendChild(td);tb.appendChild(d)});
// ---- live / in progress + final (separate from the board; refreshed every 5 min by site_sync.sh -> nhlmodel.livescores)
function renderLive(L){const root=$('live-body');root.textContent='';L=L||{};
 const upd=$('live-upd');upd.textContent=L.updated_ct?('scores as of '+L.updated_ct+' - ESPN scoreboard, auto-refreshes every 5 min'):'';
 if(L.error)root.appendChild(el('div','Live scores unavailable: '+L.error,'warn'));
 const live=L.live||[],fin=L.final||[];
 const mk=(g)=>{const away=g.away_abbr||g.away,home=g.home_abbr||g.home;return [g.away+' @ '+g.home,(g.away_score==null?'-':g.away_score)+' - '+(g.home_score==null?'-':g.home_score)+'  ('+away+' - '+home+')',g.status||'',g.start_ct||'']};
 if(!live.length&&!L.error)root.appendChild(el('p','No games in progress right now.','muted'));
 if(live.length){const t=el('table');const hd=el('tr');['game (away @ home)','score','period / clock','started (CT)','bet'].forEach(h=>hd.appendChild(el('th',h)));t.appendChild(hd);
  for(const g of live){const r=el('tr');mk(g).forEach(x=>r.appendChild(el('td',x)));r.appendChild(el('td',g.note||'in progress: no pre-game pick','muted'));t.appendChild(r)}root.appendChild(t)}
 if(fin.length){const h=el('div',null,'small');h.appendChild(el('b','Final today: '));
  h.appendChild(document.createTextNode(fin.map(g=>g.away+' '+(g.away_score==null?'-':g.away_score)+', '+g.home+' '+(g.home_score==null?'-':g.home_score)+' ('+(g.status||'Final')+'; started '+(g.start_ct||'?')+')').join('  |  ')));root.appendChild(h)}
 root.appendChild(el('div','Moneylines only. Pre-game model edges do not apply once a game has started, so live and final games show no pick.','small muted'))}
renderLive(JSON.parse($('livedata').textContent));
if(location.protocol.startsWith('http'))setInterval(async()=>{try{const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
 const d=new DOMParser().parseFromString(await r.text(),'text/html').getElementById('livedata');if(d)renderLive(JSON.parse(d.textContent))}catch(e){}},300000);
// ---- backtest
(function(){const b=P.bt,root=$('t-bt');if(!b||!b.available){root.appendChild(el('div','Backtest results unavailable: '+(b&&b.error),'warn'));return}
 root.appendChild(el('h2','Win probability log loss (lower is better)'));
 const t=el('table');const hd=el('tr');['block','n','model','Elo baseline','const home-rate','market (n)','model on same games'].forEach(h=>hd.appendChild(el('th',h)));t.appendChild(hd);
 for(const [k,v] of Object.entries(b.prob)){const r=el('tr');[k,v.n,f2(v.model_ll,4),f2(v.elo_ll,4),f2(v.const_ll,4),v.mkt_ll!=null?f2(v.mkt_ll,4)+' ('+v.n_mkt+')':'no odds',v.mkt_ll!=null?f2(v.model_ll_on_mkt,4):'-'].forEach(x=>r.appendChild(el('td',x)));t.appendChild(r)}
 root.appendChild(t);
 root.appendChild(el('p','Information test (2024-26 market seasons): coefficient on (model - market) = '+f2(b.info.coef_model_minus_market)+' +/- '+f2(b.info.se)+' (0 = nothing beyond the market, 1 = model is right). Params tuned on 2022-23 only; 2024-25 and 2025-26 untouched.'));
 root.appendChild(el('h2','ML betting at the quoted closing price (bet the model-favoured side every game, flat 1u)'));
 const t2=el('table');const h2=el('tr');['block','n','win%','ROI','claimed EV','ROI s.e.'].forEach(h=>h2.appendChild(el('th',h)));t2.appendChild(h2);
 for(const [k,v] of Object.entries(b.roi)){const r=el('tr');[k,v.all.n,pc(v.all.win),pc(v.all.roi),pc(v.all.claimed_ev),pc(v.all.roi_se)].forEach(x=>r.appendChild(el('td',x)));t2.appendChild(r)}root.appendChild(t2);
 root.appendChild(el('h2','ROI by edge bucket (hold-outs)'));
 for(const k of ['2024-25 HOLD-OUT','2025-26 HOLD-OUT (latest)','2024-26 hold-outs pooled']){const v=b.roi[k];if(!v)continue;root.appendChild(el('b',k));const tt=el('table');const hh=el('tr');['edge','n','win%','ROI','claimed EV'].forEach(h=>hh.appendChild(el('th',h)));tt.appendChild(hh);
  for(const x of v.buckets){const r=el('tr');[x.bucket,x.n,pc(x.win),pc(x.roi),pc(x.avg_ev_claimed)].forEach(y=>r.appendChild(el('td',y)));tt.appendChild(r)}root.appendChild(tt)}
 root.appendChild(el('h2','Totals vs closing total'));
 const t3=el('table');const h3=el('tr');['block','n','MSE model','MSE market','bias','win% @-110','ROI','info slope'].forEach(h=>h3.appendChild(el('th',h)));t3.appendChild(h3);
 for(const [k,v] of Object.entries(b.totals)){const r=el('tr');[k,v.n,f2(v.mse_model),f2(v.mse_market),f2(v.bias_model),pc(v.win),pc(v.roi_flat110),f2(v.info_slope)].forEach(x=>r.appendChild(el('td',x)));t3.appendChild(r)}root.appendChild(t3);
 root.appendChild(el('h2','Ablation (win-prob log loss, 2023-26)'));
 const t4=el('table');const h4=el('tr');['variant','2023-26','2025-26','mean total'].forEach(h=>h4.appendChild(el('th',h)));t4.appendChild(h4);
 for(const [k,v] of Object.entries(b.ablation)){const r=el('tr');[k,f2(v.ll,4),f2(v.ll_2025_26,4),f2(v.e_total)].forEach(x=>r.appendChild(el('td',x)));t4.appendChild(r)}root.appendChild(t4);
 root.appendChild(el('h2','Calibration (raw simulator, 2024-26)'));
 const t5=el('table');const h5=el('tr');['bin','n','predicted','actual'].forEach(h=>h5.appendChild(el('th',h)));t5.appendChild(h5);
 for(const c of b.calibration){const r=el('tr');[c.bin,c.n,f2(c.pred,3),f2(c.actual,3)].forEach(x=>r.appendChild(el('td',x)));t5.appendChild(r)}root.appendChild(t5);
 root.appendChild(el('h2','Labels'));for(const [k,v] of Object.entries(P.label_help)){const p=el('p');p.appendChild(el('b',k+': ','l-'+k));p.appendChild(document.createTextNode(v));root.appendChild(p)}
})();

(function(){const root=$('t-health');const t=el('table');for(const [k,v] of Object.entries(P.health.sources||{})){const r=el('tr');r.appendChild(el('td',k));r.appendChild(el('td',v,String(v).startsWith('ok')?'ok':'bad'));t.appendChild(r)}root.appendChild(t);
 for(const w of (P.health.warnings||[]))root.appendChild(el('div','! '+w,'warn'))})();
