<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14">
<title>NHL simulator</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--bg2:#10161e;--card:#141c26;--card2:#1a2430;--line:#243040;--ink:#e8edf2;--mut:#8796a8;--acc:#4f9dff;
--ok:#3ddc97;--okbg:rgba(61,220,151,.13);--warn:#ff7b72;--warnbg:rgba(255,123,114,.13);--amber:#f5b942;--amberbg:rgba(245,185,66,.13);--blue:#6cb2ff;--bluebg:rgba(108,178,255,.13)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}h2,h3{font-weight:650}h3{font-size:14px;margin:16px 0 6px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,15,20,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1200px;margin:0 auto;padding:9px 14px 2px}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand h1{font-size:18px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
.hmeta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:12.5px}.hmeta span:empty{display:none}
nav.sports{display:flex;gap:6px;overflow-x:auto;max-width:1200px;margin:0 auto;padding:6px 14px 9px;scrollbar-width:none}nav.sports::-webkit-scrollbar{display:none}
nav.sports a{flex:0 0 auto;padding:4px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);text-decoration:none;font-size:13px}
nav.sports a.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
main.wrap{max-width:1200px;margin:0 auto;padding:10px 14px 40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:16px 0 8px;font-weight:600}
.sec-h small{text-transform:none;letter-spacing:0;font-weight:400}
.alert{margin:10px 0;padding:9px 12px;border-radius:10px;border:1px solid var(--amber);background:var(--amberbg);color:var(--ink);font-size:13px}.alert b{color:var(--amber)}
.alert.bad{border-color:var(--warn);background:var(--warnbg)}.alert.bad b{color:var(--warn)}
.status-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--amberbg);color:var(--amber)}
.plays{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.plays{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1000px){.plays{grid-template-columns:repeat(3,minmax(0,1fr))}}
.play{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.play .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.play .badges{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.play .pick{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}.play .game{color:var(--mut);font-size:12.5px;margin-top:1px}
.play .nums{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:9px;font-size:13.5px;font-variant-numeric:tabular-nums}
.play .k{color:var(--mut);font-size:11.5px;margin-right:3px}.play .bk{color:var(--mut);font-size:12px}
.play .note{color:var(--mut);font-size:12px;margin-top:7px;line-height:1.4}
.empty{color:var(--mut);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.edge{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.edge.pos{background:var(--okbg);color:var(--ok)}.edge.neg{background:var(--warnbg);color:var(--warn)}.edge.sus{background:var(--amberbg);color:var(--amber)}.edge.neu{background:var(--card2);color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 8px;padding:3px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs .tab,.tabs button{flex:0 0 auto;padding:6px 12px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs .tab.on,.tabs button.on{background:var(--card2);color:var(--ink);font-weight:600}
.panel,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:2px 0 10px}.tools label{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
select,input,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
input[type=checkbox]{padding:0;accent-color:var(--acc)}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);color:var(--mut);font-size:11.5px;font-weight:600;white-space:nowrap;user-select:none;cursor:pointer}th:hover{color:var(--ink)}
tr:nth-child(even)>td{background:rgba(255,255,255,.028)}tr.bet>td,tr.row>td{white-space:nowrap}tr.bet,tr.row{cursor:pointer}tr.bet:hover>td,tr.row:hover>td{background:rgba(79,157,255,.08)}
tr.detail>td,tr.sub>td{background:var(--bg2);font-size:12.5px;color:var(--mut)}tr.detail b,tr.sub b{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--card2);color:var(--mut)}
.pill.SUSPECT,.pill.INJ-UNKNOWN{background:var(--warnbg);color:var(--warn)}.pill.HOLD,.pill.LOWCONF,.pill.MODEL-ONLY-LOWCONF,.pill.LOW-FLAGGED{background:var(--amberbg);color:var(--amber)}
.pill.FORWARD-TEST{background:var(--bluebg);color:var(--blue)}
.grade{display:inline-block;min-width:22px;text-align:center;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;cursor:help}
.grade.A{background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,151,.45)}.grade.B{background:var(--amberbg);color:var(--amber);border:1px solid rgba(245,185,66,.45)}.grade.C{background:var(--warnbg);color:var(--warn);border:1px solid rgba(255,123,114,.45)}.grade.NA{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:11px;white-space:nowrap;cursor:help}
.flag{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border-radius:6px;background:var(--amberbg);color:var(--amber);font-size:11.5px}
.legend{margin:4px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mut);font-size:12px}.legend .row{margin:3px 0}
.legend summary{cursor:pointer}
.ok{color:var(--ok)}.deg,.warn{color:var(--amber)}.bad,.fail{color:var(--warn)}.mut,.muted,.info{color:var(--mut)}.neg{color:var(--warn)}.pos{color:var(--ok)}
.small,small{font-size:12px}small{color:var(--mut)}.mk{font-size:11px;font-weight:700;color:var(--mut)}
ul.tight{margin:4px 0 0 18px;padding:0}ul.tight li{margin:2px 0}
details.info{margin:26px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--mut);font-size:12.5px}
details.info>summary{cursor:pointer;color:var(--mut);font-size:12.5px}details.info[open]>summary{margin-bottom:8px}
details.info .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:8px 0}
details.info .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
details.info .card h2{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
details.info p,details.info .para{margin:4px 0}
#slate-line{background:var(--bg2)!important;color:var(--mut)!important;font:500 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;padding:4px 14px!important;border-bottom:1px solid var(--line)!important}
#slate-line[style*="fde2e1"]{background:var(--warnbg)!important;color:var(--warn)!important}
.sec-h{flex-wrap:wrap}
footer.foot{max-width:1200px;margin:0 auto;padding:0 14px 28px;color:var(--mut);font-size:12px}
</style></head><body><!--slate-line--><div id="slate-line" style="font:600 14px/1.4 system-ui,sans-serif;padding:6px 12px;background:#e8f4ea;color:#123;border-bottom:1px solid #9994">Slate: Sat Oct 10 | Updated Sat Oct 10, 11:45 AM CT</div><!--/slate-line-->

function lineupNote(b){const g=gmBy[b.id],parts=[];if(g&&g.goalies){const s=x=>g.goalies[x]?((g.goalies[x].name||'?')+(g.goalies[x].status?' ('+g.goalies[x].status+')':'')):'?';parts.push('G '+s('away')+' vs '+s('home'))}
 else if(b.goalies)parts.push('goalies '+b.goalies);if(b.conf&&b.conf!=='ok')parts.push('low-conf');return parts.join(' \u00b7 ')}
(function(){const pool=bets.filter(b=>b.label!=='SUSPECT').slice().sort((a,b)=>(a.rank||0)-(b.rank||0)).slice(0,6);
 $('plays-note').textContent=pool.length?'model win % vs no-vig market, SUSPECT excluded':'';
 UI.plays($('plays'),pool.map(b=>({pick:String(b.pick||'').replace(/\s*\([+-]\d+\)\s*$/,''),sub:b.game+' \u00b7 '+b.market,when:b.start_ct,price:priceOf(b),book:b.best_book||'',model:pc(b.model_p),market:pc(b.mkt_p),
  edge:(b.edge>=0?'+':'')+(100*b.edge).toFixed(1)+' pts',edgeVal:b.edge,grade:gradeBadge(b),label:b.label,notes:[lineupNote(b),b.ev!=null?'EV at quoted price '+pc(b.ev):'']})),
  bets.length?'Only SUSPECT rows on this slate - see the table below.':(M.n_games===0?'No NHL games on '+P.date+(M.next_game_date?('; next scheduled game date '+M.next_game_date):'')+'.':'No evaluable edges on this slate (games started or no prices yet - see Data health).'))})();
// ---- bets
const bcols=[{h:'#',v:b=>b.rank,num:1},{h:'label',v:b=>b.label},{h:'data grade',v:b=>b.data_grade},{h:'type',v:b=>b.market},{h:'pick',v:b=>b.pick},{h:'game',v:b=>b.game},{h:'start (CT)',v:b=>b.start},
 {h:'model win%',v:b=>b.model_p,num:1},{h:'no-vig mkt%',v:b=>b.mkt_p,num:1},{h:'edge',v:b=>b.edge,num:1},{h:'EV @ quote',v:b=>b.ev,num:1},{h:'goalies',v:b=>b.goalies},{h:'best price @',v:b=>b.best_book},{h:'line source',v:b=>b.src},{h:'flags (hover)',v:b=>(b.chips||[]).length,num:1}];
let redraw;const openRows=new Set();
function gradeBadge(b){const g=b.data_grade;const e=el('span',g||'-','grade '+(g||'NA'));e.title=g?('Data grade '+g+': '+((P.grade_help||{})[g]||'')):'No data grade';return e}
(function(){const L=$('legend');const d=el('details',null,'legend small');d.appendChild(el('summary','What the A/B/C data grade means'));L.appendChild(d);const r0=el('div',null,'row');r0.appendChild(el('b','Data grade '));
 r0.appendChild(document.createTextNode('(A/B/C) is separate from the label: how certain the starting-goalie inputs are (Confirmed vs Likely vs unconfirmed). It says nothing about edge size or who wins. Totals rows share their game\'s grade.'));d.appendChild(r0);
 for(const g of ['A','B','C']){const r=el('div',null,'row');const b=el('span',g,'grade '+g);r.appendChild(b);r.appendChild(document.createTextNode(' '+((P.grade_help||{})[g]||'')));d.appendChild(r)}})();
function filt(){const q=$('f').value.toLowerCase(),m=$('fm').value,l=$('fl').value,g=$('fg').value,c=$('fc').checked;
 return bets.filter(b=>(!q||(b.pick+' '+b.game).toLowerCase().includes(q))&&(!m||b.market===m)&&(!l||b.label===l)&&(!g||(b.data_grade||'-')===g)&&(!c||b.goalies==='confirmed'))}
function drawBets(){const tb=$('bt1');
 const rows=filt();const cols=bcols;tb.textContent='';const th=el('thead');const tr=el('tr');
 cols.forEach((c,i)=>{const h=el('th',c.h);h.onclick=()=>{drawBets.key=i;drawBets.dir=(drawBets.key===i&&drawBets.last===i)?-(drawBets.dir||1):(c.num?-1:1);drawBets.last=i;drawBets()};tr.appendChild(h)});th.appendChild(tr);tb.appendChild(th);
 let r=rows.slice();if(drawBets.key!=null){const c=cols[drawBets.key],d=drawBets.dir||1;r.sort((a,b)=>{const x=c.v(a),y=c.v(b);if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*d})}
 const body=el('tbody');tb.appendChild(body);
 if(!r.length){const t=el('tr');const td=el('td',bets.length?'No rows match the filter.':'No evaluable games/edges for this slate (see health/warnings).','muted');td.colSpan=cols.length;t.appendChild(td);body.appendChild(t)}
 for(const b of r){const t=el('tr',null,'bet');
  [b.rank,null,'G',b.market,b.pick,b.game,b.start_ct,pc(b.model_p),pc(b.mkt_p),b.market==='ML'?pc(b.edge):('+'+pc(b.edge)+' vs 50%'),pc(b.ev),b.goalies+(b.conf==='ok'?'':' / low-conf'),b.best_book||'',b.src||'ESPN','C'].forEach((x,i)=>{
   let td;
   if(i===1){td=el('td');const p=UI.labPill(b.label,(P.label_help||{})[b.label]);if(p)td.appendChild(p)}
   else if(i===2){td=el('td');td.appendChild(gradeBadge(b))}
   else if(i===14){td=el('td');for(const c of (b.chips||[])){const sp=el('span',c[0],'chip');sp.title=c[1];td.appendChild(sp)}}
   else{td=el('td',x,i===11&&b.goalies!=='confirmed'?'warn':(i===4?'':(i>=7&&i<=10?'num':'')));if(i===4)td.style.fontWeight='600'}
   t.appendChild(td)});
  const id=b.id+b.market;t.onclick=()=>{openRows.has(id)?openRows.delete(id):openRows.add(id);drawBets()};body.appendChild(t);
  if(openRows.has(id)){const s=el('tr',null,'sub');const td=el('td');td.colSpan=cols.length;
   const d1=el('div');d1.appendChild(el('b','Data grade: '));d1.appendChild(gradeBadge(b));d1.appendChild(document.createTextNode(' '+((P.grade_help||{})[b.data_grade]||'')));td.appendChild(d1);
   if(b.flags&&b.flags.length){const d2=el('div');d2.appendChild(el('b','Flags (full text): '));for(const f of b.flags){d2.appendChild(el('span',f,'flag'))}td.appendChild(d2)}
   s.appendChild(td);body.appendChild(s)}}}
['f','fm','fl','fg','fc'].forEach(i=>$(i).addEventListener('input',drawBets));drawBets();
// ---- games
const gm=(P.games||[]);
const gcols=[{h:'start (CT)',v:g=>g.start},{h:'game',v:g=>g.away+' @ '+g.home},{h:'state',v:g=>g.status},{h:'data grade',v:g=>g.data_grade},{h:'away G',v:g=>g.goalies&&g.goalies.away&&g.goalies.away.name},{h:'home G',v:g=>g.goalies&&g.goalies.home&&g.goalies.home.name},
 {h:'model home win%',v:g=>g.model&&g.model.home_win,num:1},{h:'mkt home %',v:g=>g.market&&g.market.novig_home,num:1},{h:'exp goals A-H',v:g=>g.model&&g.model.exp_total,num:1},{h:'mkt total',v:g=>g.market&&g.market.total,num:1},{h:'line source',v:g=>g.market&&g.market.source},{h:'goalie status A/H',v:g=>g.goalies&&((g.goalies.away&&g.goalies.away.status)+'/'+(g.goalies.home&&g.goalies.home.status))}];
const gt=$('gt');
sortable(gt,gcols,gm,(tb,g)=>{const t=el('tr');
 const sp=s=>g.goalies&&g.goalies[s]?((g.goalies[s].name||'?')+' ['+g.goalies[s].status+']'):'-';
 [g.start_ct,g.away+' @ '+g.home,g.status,null,sp('away'),sp('home'),g.model?pc(g.model.home_win):'-',g.market?pc(g.market.novig_home):'-',g.model?(f2(g.model.exp_away,1)+' - '+f2(g.model.exp_home,1)+' (tot '+f2(g.model.exp_total,1)+')'):(g.note||'-'),g.market&&g.market.total!=null?g.market.total:'-',g.market?(g.market.source||'ESPN'):'-',g.goalies?((g.goalies.away?g.goalies.away.status:'-')+' / '+(g.goalies.home?g.goalies.home.status:'-')):'-'].forEach((x,i)=>{if(i===3){const td=el('td');if(g.model)td.appendChild(gradeBadge(g));else td.textContent='-';t.appendChild(td)}else t.appendChild(el('td',x))});tb.appendChild(t);
 const d=el('tr',null,'sub');const td=el('td');td.colSpan=12;
 const parts=[];if(g.goalies)for(const x of['away','home']){const l=g.goalies[x];if(l)parts.push(x+' goalie: '+(l.name||'?')+' ('+l.status+', '+l.source+(l.rest!=null?', rest '+l.rest+'d':'')+')')}
 if(g.model)parts.push('home win '+pc(g.model.home_win)+'; P(tied after 60) '+pc(g.model.p_reg_tie)+'; puck line home -1.5 '+pc(g.model.home_minus1_5)+', away -1.5 '+pc(g.model.away_minus1_5));
 if(g.model&&g.data_grade)parts.push('data grade '+g.data_grade+': '+((P.grade_help||{})[g.data_grade]||''));
 if(g.flags)parts.push('FLAGS: '+g.flags.join(' | '));
 td.textContent=parts.join('\n');td.style.whiteSpace='pre-wrap';d.appendChild(td);tb.appendChild(d)});
// ---- live / in progress + final (separate from the board; refreshed every 5 min by site_sync.sh -> nhlmodel.livescores)
function renderLive(L){const root=$('live-body');root.textContent='';L=L||{};
 const upd=$('live-upd');upd.textContent=L.updated_ct?('scores as of '+L.updated_ct+' - ESPN scoreboard, auto-refreshes every 5 min'):'';
 if(L.error)root.appendChild(el('div','Live scores unavailable: '+L.error,'small warn'));
 const live=L.live||[],fin=L.final||[];
 const mk=(g)=>{const away=g.away_abbr||g.away,home=g.home_abbr||g.home;return [g.away+' @ '+g.home,(g.away_score==null?'-':g.away_score)+' - '+(g.home_score==null?'-':g.home_score)+'  ('+away+' - '+home+')',g.status||'',g.start_ct||'']};
 if(!live.length&&!L.error)root.appendChild(el('p','No games in progress right now.','small muted'));
 if(live.length){const t=el('table');const hd=el('tr');['game (away @ home)','score','period / clock','started (CT)','bet'].forEach(h=>hd.appendChild(el('th',h)));t.appendChild(hd);
  for(const g of live){const r=el('tr');mk(g).forEach(x=>r.appendChild(el('td',x)));r.appendChild(el('td',g.note||'in progress: no pre-game pick','muted'));t.appendChild(r)}root.appendChild(t)}
 if(fin.length){const h=el('div',null,'small');h.appendChild(el('b','Final today: '));
  h.appendChild(document.createTextNode(fin.map(g=>g.away+' '+(g.away_score==null?'-':g.away_score)+', '+g.home+' '+(g.home_score==null?'-':g.home_score)+' ('+(g.status||'Final')+'; started '+(g.start_ct||'?')+')').join('  |  ')));root.appendChild(h)}
 root.appendChild(el('div','Moneylines only. Pre-game model edges do not apply once a game has started, so live and final games show no pick.','small muted'))}
renderLive(JSON.parse($('livedata').textContent));
if(location.protocol.startsWith('http'))setInterval(async()=>{try{const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
 const d=new DOMParser().parseFromString(await r.text(),'text/html').getElementById('livedata');if(d)renderLive(JSON.parse(d.textContent))}catch(e){}},300000);
// ---- health
(function(){const root=$('t-health');UI.statusAlert(root,st);{const o=M.odds_api||null;if(o)root.appendChild(el('p','Lines: '+(o.n_games_priced?o.n_games_priced+' games from The Odds API (avg of books)':'ESPN/DraftKings (Odds API '+o.status+')')+' | Odds API quota remaining '+(o.remaining==null?'?':o.remaining),'small muted'))}const t=el('table');for(const [k,v] of Object.entries(P.health.sources||{})){const r=el('tr');r.appendChild(el('td',k));r.appendChild(el('td',v,String(v).startsWith('ok')?'ok':'bad'));t.appendChild(r)}root.appendChild(t);
 for(const w of (P.health.warnings||[]))root.appendChild(el('div','! '+w,'small warn'))})();
</script></body></html>
