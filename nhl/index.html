*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}h2,h3{font-weight:650}h3{font-size:14px;margin:16px 0 6px}

.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand h1{font-size:18px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}

main.wrap{max-width:1200px;margin:0 auto;padding:10px 14px 40px}

.alert{margin:10px 0;padding:9px 12px;border-radius:10px;border:1px solid var(--amber);background:var(--amberbg);color:var(--ink);font-size:13px}.alert b{color:var(--amber)}
.alert.bad{border-color:var(--warn);background:var(--warnbg)}.alert.bad b{color:var(--warn)}

.plays{display:grid;grid-template-columns:1fr;gap:10px}

.play{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.play .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.play .badges{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.play .pick{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}.play .game{color:var(--mut);font-size:12.5px;margin-top:1px}

.play .k{color:var(--mut);font-size:11.5px;margin-right:3px}.play .bk{color:var(--mut);font-size:12px}
.play .note{color:var(--mut);font-size:12px;margin-top:7px;line-height:1.4}
.empty{color:var(--mut);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.edge{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.edge.pos{background:var(--okbg);color:var(--ok)}.edge.neg{background:var(--warnbg);color:var(--warn)}.edge.sus{background:var(--amberbg);color:var(--amber)}.edge.neu{background:var(--card2);color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 8px;padding:3px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs .tab,.tabs button{flex:0 0 auto;padding:6px 12px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs .tab.on,.tabs button.on{background:var(--card2);color:var(--ink);font-weight:600}
.panel,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:2px 0 10px}.tools label{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
select,input,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}

const bets=P.bets||[];
const gmBy={};(P.games||[]).forEach(g=>{gmBy[g.id]=g});

function lineupNote(b){const g=gmBy[b.id],parts=[];if(g&&g.goalies){const s=x=>g.goalies[x]?((g.goalies[x].name||'?')+(g.goalies[x].status?' ('+g.goalies[x].status+')':'')):'?';parts.push('G '+s('away')+' vs '+s('home'))}
 else if(b.goalies)parts.push('goalies '+b.goalies);if(b.conf&&b.conf!=='ok')parts.push('low-conf');return parts.join(' \u00b7 ')}
(function(){const pool=bets.filter(b=>b.label!=='SUSPECT').slice().sort((a,b)=>(a.rank||0)-(b.rank||0)).slice(0,6);
 $('plays-note').textContent=pool.length?'model win % vs no-vig market, SUSPECT excluded':'';
 UI.plays($('plays'),pool.map(b=>({pick:String(b.pick||'').replace(/\s*\([+-]\d+\)\s*$/,''),sub:b.game+' \u00b7 '+b.market,when:b.start_ct,price:priceOf(b),book:b.best_book||'',model:pc(b.model_p),market:pc(b.mkt_p),
  edge:(b.edge>=0?'+':'')+(100*b.edge).toFixed(1)+' pts',edgeVal:b.edge,grade:gradeBadge(b),label:b.label,notes:[lineupNote(b),b.ev!=null?'EV at quoted price '+pc(b.ev):'']})),
  bets.length?'Only SUSPECT rows on this slate - see the table below.':(M.n_games===0?'No NHL games on '+P.date+(M.next_game_date?('; next scheduled game date '+M.next_game_date):'')+'.':'No evaluable edges on this slate (games started or no prices yet - see Data health).'))})();

const bcols=[{h:'#',v:b=>b.rank,num:1},{h:'label',v:b=>b.label},{h:'pick grade',v:b=>b.pick_grade},{h:'type',v:b=>b.market},{h:'pick',v:b=>b.pick},{h:'game',v:b=>b.game},{h:'start (CT)',v:b=>b.start},
 {h:'model win%',v:b=>b.model_p,num:1},{h:'no-vig mkt%',v:b=>b.mkt_p,num:1},{h:'edge',v:b=>b.edge,num:1},{h:'EV @ quote',v:b=>b.ev,num:1},{h:'goalies',v:b=>b.goalies},{h:'best price @',v:b=>b.best_book},{h:'line source',v:b=>b.src},{h:'flags (hover)',v:b=>(b.chips||[]).length,num:1}];
let redraw;const openRows=new Set();
function pickTip(b){return b.pick_edge==null?'':((b.pick_edge>=0?'+':'')+b.pick_edge.toFixed(1)+' pts over break-even, EV '+(b.pick_ev>=0?'+':'')+b.pick_ev.toFixed(1)+'%')}
function gradeBadge(b){const g=b.pick_grade;const e=el('span',g||'-','grade '+(g||'NA'));e.title=g?('Pick grade '+g+': '+pickTip(b)+'. '+((P.pick_help||{})[g]||'')):'Price is at or above the model fair price';return e}
(function(){const L=$('legend');const d=el('details',null,'legend small');d.appendChild(el('summary','What the A/B/C pick grade means'));L.appendChild(d);const r0=el('div',null,'row');r0.appendChild(el('b','Pick grade '));
 r0.appendChild(document.createTextNode('(A/B/C) = how strong the play is at the best available price: edge = model chance minus the break-even chance of that price, in points, plus expected return (EV).'));d.appendChild(r0);
 for(const g of ['A','B','C']){const r=el('div',null,'row');const b=el('span',g,'grade '+g);r.appendChild(b);r.appendChild(document.createTextNode(' '+((P.pick_help||{})[g]||'')));d.appendChild(r)}})();
function filt(){const q=$('f').value.toLowerCase(),m=$('fm').value,l=$('fl').value,g=$('fg').value,c=$('fc').checked;
 return bets.filter(b=>(!q||(b.pick+' '+b.game).toLowerCase().includes(q))&&(!m||b.market===m)&&(!l||b.label===l)&&(!g||(b.pick_grade||'-')===g)&&(!c||b.goalies==='confirmed'))}
function drawBets(){const tb=$('bt1');
 const rows=filt();const cols=bcols;tb.textContent='';const th=el('thead');const tr=el('tr');
 cols.forEach((c,i)=>{const h=el('th',c.h);h.onclick=()=>{drawBets.key=i;drawBets.dir=(drawBets.key===i&&drawBets.last===i)?-(drawBets.dir||1):(c.num?-1:1);drawBets.last=i;drawBets()};tr.appendChild(h)});th.appendChild(tr);tb.appendChild(th);
 let r=rows.slice();if(drawBets.key!=null){const c=cols[drawBets.key],d=drawBets.dir||1;r.sort((a,b)=>{const x=c.v(a),y=c.v(b);if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*d})}
 const body=el('tbody');tb.appendChild(body);
 if(!r.length){const t=el('tr');const td=el('td',bets.length?'No rows match the filter.':'No evaluable games/edges for this slate (see health/warnings).','muted');td.colSpan=cols.length;t.appendChild(td);body.appendChild(t)}
 for(const b of r){const t=el('tr',null,'bet');
  [b.rank,null,'G',b.market,b.pick,b.game,b.start_ct,pc(b.model_p),pc(b.mkt_p),b.market==='ML'?pc(b.edge):('+'+pc(b.edge)+' vs 50%'),pc(b.ev),b.goalies+(b.conf==='ok'?'':' / low-conf'),b.best_book||'',b.src||'ESPN','C'].forEach((x,i)=>{
   let td;
   if(i===1){td=el('td');const p=UI.labPill(b.label,(P.label_help||{})[b.label]);if(p)td.appendChild(p)}
   else if(i===2){td=el('td');td.appendChild(gradeBadge(b))}
   else if(i===14){td=el('td');for(const c of (b.chips||[])){const sp=el('span',c[0],'chip');sp.title=c[1];td.appendChild(sp)}}
   else{td=el('td',x,i===11&&b.goalies!=='confirmed'?'warn':(i===4?'':(i>=7&&i<=10?'num':'')));if(i===4)td.style.fontWeight='600'}
   t.appendChild(td)});
  const id=b.id+b.market;t.onclick=()=>{openRows.has(id)?openRows.delete(id):openRows.add(id);drawBets()};body.appendChild(t);
  if(openRows.has(id)){const s=el('tr',null,'sub');const td=el('td');td.colSpan=cols.length;
   const d1=el('div');d1.appendChild(el('b','Pick grade: '));d1.appendChild(gradeBadge(b));d1.appendChild(document.createTextNode(' '+(b.pick_grade?pickTip(b)+'. '+((P.pick_help||{})[b.pick_grade]||''):'Price is at or above the model fair price.')));td.appendChild(d1);
   if(b.flags&&b.flags.length){const d2=el('div');d2.appendChild(el('b','Flags (full text): '));for(const f of b.flags){d2.appendChild(el('span',f,'flag'))}td.appendChild(d2)}
   s.appendChild(td);body.appendChild(s)}}}
['f','fm','fl','fg','fc'].forEach(i=>$(i).addEventListener('input',drawBets));drawBets();

const gcols=[{h:'start (CT)',v:g=>g.start},{h:'game',v:g=>g.away+' @ '+g.home},{h:'state',v:g=>g.status},{h:'away G',v:g=>g.goalies&&g.goalies.away&&g.goalies.away.name},{h:'home G',v:g=>g.goalies&&g.goalies.home&&g.goalies.home.name},

const gt=$('gt');
sortable(gt,gcols,gm,(tb,g)=>{const t=el('tr');
 const sp=s=>g.goalies&&g.goalies[s]?((g.goalies[s].name||'?')+' ['+g.goalies[s].status+']'):'-';
 [g.start_ct,g.away+' @ '+g.home,g.status,sp('away'),sp('home'),g.model?pc(g.model.home_win):'-',g.market?pc(g.market.novig_home):'-',g.model?(f2(g.model.exp_away,1)+' - '+f2(g.model.exp_home,1)+' (tot '+f2(g.model.exp_total,1)+')'):(g.note||'-'),g.market&&g.market.total!=null?g.market.total:'-',g.market?(g.market.source||'ESPN'):'-',g.goalies?((g.goalies.away?g.goalies.away.status:'-')+' / '+(g.goalies.home?g.goalies.home.status:'-')):'-'].forEach(x=>t.appendChild(el('td',x)));tb.appendChild(t);
 const d=el('tr',null,'sub');const td=el('td');td.colSpan=12;
 const parts=[];if(g.goalies)for(const x of['away','home']){const l=g.goalies[x];if(l)parts.push(x+' goalie: '+(l.name||'?')+' ('+l.status+', '+l.source+(l.rest!=null?', rest '+l.rest+'d':'')+')')}
 if(g.model)parts.push('home win '+pc(g.model.home_win)+'; P(tied after 60) '+pc(g.model.p_reg_tie)+'; puck line home -1.5 '+pc(g.model.home_minus1_5)+', away -1.5 '+pc(g.model.away_minus1_5));

 if(g.flags)parts.push('FLAGS: '+g.flags.join(' | '));
 td.textContent=parts.join('\n');td.style.whiteSpace='pre-wrap';d.appendChild(td);tb.appendChild(d)});

function renderLive(L){const root=$('live-body');root.textContent='';L=L||{};
 const upd=$('live-upd');upd.textContent=L.updated_ct?('scores as of '+L.updated_ct+' - ESPN scoreboard, auto-refreshes every 5 min'):'';
 if(L.error)root.appendChild(el('div','Live scores unavailable: '+L.error,'small warn'));
 const live=L.live||[],fin=L.final||[];
 const mk=(g)=>{const away=g.away_abbr||g.away,home=g.home_abbr||g.home;return [g.away+' @ '+g.home,(g.away_score==null?'-':g.away_score)+' - '+(g.home_score==null?'-':g.home_score)+'  ('+away+' - '+home+')',g.status||'',g.start_ct||'']};
 if(!live.length&&!L.error)root.appendChild(el('p','No games in progress right now.','small muted'));
 if(live.length){const t=el('table');const hd=el('tr');['game (away @ home)','score','period / clock','started (CT)','bet'].forEach(h=>hd.appendChild(el('th',h)));t.appendChild(hd);
  for(const g of live){const r=el('tr');mk(g).forEach(x=>r.appendChild(el('td',x)));r.appendChild(el('td',g.note||'in progress: no pre-game pick','muted'));t.appendChild(r)}root.appendChild(t)}
 if(fin.length){const h=el('div',null,'small');h.appendChild(el('b','Final today: '));
  h.appendChild(document.createTextNode(fin.map(g=>g.away+' '+(g.away_score==null?'-':g.away_score)+', '+g.home+' '+(g.home_score==null?'-':g.home_score)+' ('+(g.status||'Final')+'; started '+(g.start_ct||'?')+')').join('  |  ')));root.appendChild(h)}
 root.appendChild(el('div','Moneylines only. Pre-game model edges do not apply once a game has started, so live and final games show no pick.','small muted'))}

if(location.protocol.startsWith('http'))setInterval(async()=>{try{const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
