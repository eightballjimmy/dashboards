a{color:var(--blue)}h2,h3{font-weight:650}h3{font-size:14px;margin:16px 0 6px}

main.wrap{max-width:1200px;margin:0 auto;padding:10px 14px 40px}

.play{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}

for(const m of rows){const tr=$('tr',{class:'row'},$('td',{text:UI.ct(m.start)||(m.start||'').replace('T',' ').slice(5,16)}),$('td',{text:m.tour.toUpperCase()}),$('td',{text:m.event}),$('td',{text:m.round}),$('td',{text:m.a_name}),$('td',{text:m.b_name}),$('td',{text:m.surface||''}),$('td',{class:'num',text:pc(m.p_a,0)}),$('td',{text:m.pick||''}),$('td',{class:'num',text:pc(m.pick_p,0)}),$('td',{class:'num',text:pc(m.mkt_p,0)}),$('td',{class:'num',text:m.edge==null?'':pc(m.edge)}),$('td',{class:'num',text:m.ev==null?'':sg(m.ev*100)+'%'}),$('td',{class:'num',text:f(m.total_mean,1)}),$('td',{class:'num',text:m.total_edge_games==null?'':sg(m.total_edge_games)}),$('td',null,m.label?$('span',{class:'pill '+m.label,text:m.label}):''),$('td',null,m.p_a!=null?gradeBadge(m):''),$('td',null,...(m.chips||[]).map(c=>$('span',{class:'chip',title:c[1],text:c[0]}))),$('td',{text:m.status}));
tr.style.cursor='pointer';tr.onclick=()=>{S.open.has(m.key)?S.open.delete(m.key):S.open.add(m.key);draw(true)};tb.append(tr);
if(S.open.has(m.key)){const ss=(m.set_scores||[]).map(x=>x[0]+' '+pc(x[1],0)).join(', ');
tb.append($('tr',{class:'detail'},$('td',{colspan:cols.length},m.market?$('div',{class:'small'},'Fair P(A) '+pc(m.p_a,1)+' (bookmaker consensus with the margin removed) | consensus no-vig A '+pc(m.market.nv_a,1)+' | ratings model P(A) '+pc(m.p_model,1)+' | best price A '+f(m.market.max_a)+(m.market.book_a?' ('+m.market.book_a+')':'')+', B '+f(m.market.max_b)+(m.market.book_b?' ('+m.market.book_b+')':'')):null,
$('div',{class:'small'},'Elo (surface-adjusted) A '+f(m.elo_a,0)+' / B '+f(m.elo_b,0)+' | rank A '+(m.rank_a||'?')+' / B '+(m.rank_b||'?')+' | Elo-only P(A) '+pc(m.p_elo,0)+' | point-sim P(A) '+pc(m.p_sim,0)+' | serve-pt prob A '+pc(m.serve_a,1)+' B '+pc(m.serve_b,1)+' | best-of '+m.best_of+' | H2H meetings '+m.h2h),
$('div',{class:'small'},'Likely set scores (A-B): '+ss+' | total games mean '+f(m.total_mean,1)+' sd '+f(m.total_sd,1)+' median '+m.total_median+' | model line '+m.total_line_model+' P(over) '+pc(m.p_over_model,0)),
$('div',{class:'small'},'Rest days A '+m.rest_a+' B '+m.rest_b+' | minutes last 7d A '+Math.round(m.mins7_a)+' B '+Math.round(m.mins7_b)+' | matches in history A '+m.n_a+' B '+m.n_b),
m.market?$('div',{class:'small'},'Market: '+m.market.book+' decimal A '+f(m.market.dec_a)+' B '+f(m.market.dec_b)+(m.market.total_line!=null?' | total line '+m.market.total_line:'')+(m.total_market_line!=null?' | model P(over) '+pc(m.total_p_over,0):'')):$('div',{class:'small mut',text:'No market price available for this match.'}),
m.data_grade?$('div',{class:'small'},$('b',{text:'Data grade: '}),gradeBadge(m),' '+((D.grade_help||{})[m.data_grade]||'')+(m.ns_a!=null?' | matches on '+(m.surface||'?')+': A '+m.ns_a+', B '+m.ns_b+' (career: A '+m.n_a+', B '+m.n_b+')':'')):null,
$('div',{class:'small '+(m.flags&&m.flags.length?'warn':'mut')},'Flags: '+((m.flags||[]).join('; ')||'none')),m.notes&&m.notes.length?$('div',{class:'small mut',text:'Notes: '+m.notes.join('; ')}):null)))}}
P.append(tb);if(!rows.length)P.append($('div',{class:'mut',style:'padding:10px',text:D.counts.slate?'No rows match the filters.':'EMPTY SLATE: no ATP/WTA singles matches found for the run date and the next day.'}))}
function gradeBadge(m){const g=m.data_grade;return $('span',{class:'grade '+(g||'NA'),title:g?'Data grade '+g+': '+((D.grade_help||{})[g]||''):'No data grade',text:g||'-'})}
function legend(){const L=$('details',{class:'legend small'},$('summary',{text:'What the A/B/C data grade means'}));L.append($('div',{class:'row'},$('b',{text:'Data grade '}),'(A/B/C) is separate from the label: how solid the inputs are (match samples on the surface, retirement / layoff / qualifier caveats, number of books behind the price). It says nothing about edge size or who wins.'));
for(const g of['A','B','C'])L.append($('div',{class:'row'},$('span',{class:'grade '+g,text:g}),' '+((D.grade_help||{})[g]||'')));return L}
function sortBy(c){S.sort=S.sort[0]===c?[c,-S.sort[1]]:[c,(c==='edge'||c==='ev'||c.startsWith('p')||c==='total_mean')?-1:1];draw(true)}
function health(P){UI.statusAlert(P,D.status);const tb=$('table',null,$('tr',null,$('th',{text:'Status'}),$('th',{text:'Source'}),$('th',{text:'Detail'})));for(const[s,n,m]of D.health)tb.append($('tr',null,$('td',{class:s,text:s.toUpperCase()}),$('td',{text:n}),$('td',{text:m})));P.append(tb);
if(D.changes&&D.changes.length){P.append($('h2',{text:'Changes since last run'}));for(const c of D.changes)P.append($('div',{class:'small',text:c}))}}

const P=document.getElementById('panel');P.textContent='';(S.tab==='matches'?matches:health)(P);if(keep)window.scrollTo(0,sc)}
