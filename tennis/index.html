<!doctype html><!--skin-v1--><!--polish-v1--><html lang="en"><head><meta charset="utf-8"><title>Tennis model</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><style>
:root{color-scheme:dark;--bg:#0b0f14;--bg2:#10161e;--card:#141c26;--card2:#1a2430;--line:#243040;--ink:#e8edf2;--mut:#8796a8;--acc:#4f9dff;
--ok:#3ddc97;--okbg:rgba(61,220,151,.13);--warn:#ff7b72;--warnbg:rgba(255,123,114,.13);--amber:#f5b942;--amberbg:rgba(245,185,66,.13);--blue:#6cb2ff;--bluebg:rgba(108,178,255,.13)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}h2,h3{font-weight:650}h3{font-size:14px;margin:16px 0 6px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,15,20,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1200px;margin:0 auto;padding:9px 14px 2px}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand h1{font-size:18px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
.hmeta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:12.5px}.hmeta span:empty{display:none}
nav.sports{display:flex;gap:6px;overflow-x:auto;max-width:1200px;margin:0 auto;padding:6px 14px 9px;scrollbar-width:none}nav.sports::-webkit-scrollbar{display:none}
nav.sports a{flex:0 0 auto;padding:4px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);text-decoration:none;font-size:13px}
nav.sports a.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
main.wrap{max-width:1200px;margin:0 auto;padding:10px 14px 40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:16px 0 8px;font-weight:600}
.sec-h small{text-transform:none;letter-spacing:0;font-weight:400}
.alert{margin:10px 0;padding:9px 12px;border-radius:10px;border:1px solid var(--amber);background:var(--amberbg);color:var(--ink);font-size:13px}.alert b{color:var(--amber)}
.alert.bad{border-color:var(--warn);background:var(--warnbg)}.alert.bad b{color:var(--warn)}
.status-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--amberbg);color:var(--amber)}
.plays{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.plays{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1000px){.plays{grid-template-columns:repeat(3,minmax(0,1fr))}}
.play{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.play .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.play .badges{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.play .pick{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}.play .game{color:var(--mut);font-size:12.5px;margin-top:1px}
.play .nums{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:9px;font-size:13.5px;font-variant-numeric:tabular-nums}
.play .k{color:var(--mut);font-size:11.5px;margin-right:3px}.play .bk{color:var(--mut);font-size:12px}
.play .note{color:var(--mut);font-size:12px;margin-top:7px;line-height:1.4}
.empty{color:var(--mut);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.edge{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.edge.pos{background:var(--okbg);color:var(--ok)}.edge.neg{background:var(--warnbg);color:var(--warn)}.edge.sus{background:var(--amberbg);color:var(--amber)}.edge.neu{background:var(--card2);color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 8px;padding:3px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs .tab,.tabs button{flex:0 0 auto;padding:6px 12px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs .tab.on,.tabs button.on{background:var(--card2);color:var(--ink);font-weight:600}
.panel,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:2px 0 10px}.tools label{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
select,input,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
input[type=checkbox]{padding:0;accent-color:var(--acc)}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);color:var(--mut);font-size:11.5px;font-weight:600;white-space:nowrap;user-select:none;cursor:pointer}th:hover{color:var(--ink)}
tr:nth-child(even)>td{background:rgba(255,255,255,.028)}tr.bet>td,tr.row>td{white-space:nowrap}tr.bet,tr.row{cursor:pointer}tr.bet:hover>td,tr.row:hover>td{background:rgba(79,157,255,.08)}
tr.detail>td,tr.sub>td{background:var(--bg2);font-size:12.5px;color:var(--mut)}tr.detail b,tr.sub b{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--card2);color:var(--mut)}
.pill.SUSPECT,.pill.INJ-UNKNOWN{background:var(--warnbg);color:var(--warn)}.pill.HOLD,.pill.LOWCONF,.pill.MODEL-ONLY-LOWCONF,.pill.LOW-FLAGGED{background:var(--amberbg);color:var(--amber)}
.pill.FORWARD-TEST{background:var(--bluebg);color:var(--blue)}
.grade{display:inline-block;min-width:22px;text-align:center;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;cursor:help}
.grade.A{background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,151,.45)}.grade.B{background:var(--amberbg);color:var(--amber);border:1px solid rgba(245,185,66,.45)}.grade.C{background:var(--warnbg);color:var(--warn);border:1px solid rgba(255,123,114,.45)}.grade.NA{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:11px;white-space:nowrap;cursor:help}
.flag{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border-radius:6px;background:var(--amberbg);color:var(--amber);font-size:11.5px}
.legend{margin:4px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mut);font-size:12px}.legend .row{margin:3px 0}
.legend summary{cursor:pointer}
.ok{color:var(--ok)}.deg,.warn{color:var(--amber)}.bad,.fail{color:var(--warn)}.mut,.muted,.info{color:var(--mut)}.neg{color:var(--warn)}.pos{color:var(--ok)}
.small,small{font-size:12px}small{color:var(--mut)}.mk{font-size:11px;font-weight:700;color:var(--mut)}
ul.tight{margin:4px 0 0 18px;padding:0}ul.tight li{margin:2px 0}
details.info{margin:26px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--mut);font-size:12.5px}
details.info>summary{cursor:pointer;color:var(--mut);font-size:12.5px}details.info[open]>summary{margin-bottom:8px}
details.info .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:8px 0}
details.info .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
details.info .card h2{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
details.info p,details.info .para{margin:4px 0}
#slate-line{background:var(--bg2)!important;color:var(--mut)!important;font:500 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;padding:4px 14px!important;border-bottom:1px solid var(--line)!important}
#slate-line[style*="fde2e1"]{background:var(--warnbg)!important;color:var(--warn)!important}
.sec-h{flex-wrap:wrap}
footer.foot{max-width:1200px;margin:0 auto;padding:0 14px 28px;color:var(--mut);font-size:12px}
</style><style id="rec-css">
/* model projected-side record (apply_record.py): uses the skin variables, falls back to dark defaults */
.rec-sec .sec-h{cursor:pointer}
.rec-sec.closed>.sec-b{display:none}
.rec-sub{color:var(--mut,#9db0d0);font-size:12.5px;margin:-4px 2px 10px}
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec-box{position:relative;background:linear-gradient(160deg,rgba(var(--sp-rgb,91,140,255),.16),transparent 62%),var(--card,#10192e);border:1px solid var(--line,#24345a);border-top:4px solid var(--sp,#5b8cff);border-radius:16px;padding:12px 12px 12px;box-shadow:0 10px 24px -16px rgba(0,0,0,.9);min-width:0}
.rec-box h4{margin:0;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut,#9db0d0)}
.rec-big{font-size:31px;font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-top:6px;color:var(--ink,#f3f6fc);white-space:nowrap}
.rec-big small{font-size:15px;font-weight:800;color:var(--mut,#9db0d0);margin-left:4px;letter-spacing:0}
.rec-pct{font-size:13px;font-weight:800;margin-top:2px}
.rec-pct.hi{color:var(--ok,#2ff0a0)}.rec-pct.mid{color:var(--amber,#ffc233)}.rec-pct.lo{color:var(--warn,#ff6683)}.rec-pct.na{color:var(--mut,#9db0d0)}
.rec-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.rec-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sp,#5b8cff),var(--sp2,#8b5cf6))}
.rec-gm{font-size:11.5px;color:var(--mut,#9db0d0);margin-top:6px}
.rec-lines{margin-top:12px;background:var(--card,#10192e);border:1px solid var(--line,#24345a);border-radius:16px;overflow:hidden}
.rec-lh{display:grid;grid-template-columns:1fr 76px 76px;gap:6px;padding:8px 12px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut,#9db0d0);background:rgba(255,255,255,.03)}
.rec-lh span+span,.rec-lr .v{text-align:right}
.rec-lr{display:grid;grid-template-columns:1fr 76px 76px;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line,#24345a)}
.rec-lr .l b{display:block;font-size:13.5px;color:var(--ink,#f3f6fc)}
.rec-lr .l span{display:block;font-size:11px;color:var(--mut,#9db0d0);line-height:1.3;margin-top:1px}
.rec-lr .v{font-size:15px;font-weight:800;color:var(--ink,#f3f6fc);white-space:nowrap}
.rec-lr .v em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--mut,#9db0d0)}
.rec-lr .v em.hi{color:var(--ok,#2ff0a0)}.rec-lr .v em.mid{color:var(--amber,#ffc233)}.rec-lr .v em.lo{color:var(--warn,#ff6683)}
.rec-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.rec-d{border-radius:11px;padding:6px 2px 5px;text-align:center;background:var(--card,#10192e);border:1px solid var(--line,#24345a);min-width:0}
.rec-d b{display:block;font-size:12.5px;line-height:1.2;color:var(--ink,#f3f6fc)}
.rec-d span{display:block;font-size:9.5px;color:var(--mut,#9db0d0);letter-spacing:.02em}
.rec-d.hi{background:var(--okbg,rgba(47,240,160,.14));border-color:rgba(47,240,160,.5)}
.rec-d.lo{background:var(--warnbg,rgba(255,102,131,.15));border-color:rgba(255,102,131,.5)}
.rec-d.mid{background:var(--amberbg,rgba(255,194,51,.15));border-color:rgba(255,194,51,.5)}
.rec-d.na{opacity:.55}
.rec-dl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut,#9db0d0);margin:12px 2px -6px}
.rec-note{font-size:11.5px;color:var(--mut,#9db0d0);margin:12px 2px 0;line-height:1.45}
.rec-empty{background:var(--card,#10192e);border:1px dashed var(--line,#24345a);border-radius:16px;padding:16px;color:var(--mut,#9db0d0);font-size:13.5px;line-height:1.45}
.rec-empty b{color:var(--ink,#f3f6fc)}

/* ===== Model Desk polish v1 : institutional / terminal refinement layer. Loaded LAST. Presentation only. ===== */
:root{
--bg:#070c16;--bg2:#0b1220;--card:#0f1727;--card2:#151f35;--line:#1f2c47;--line2:#2a3b5e;--ink:#e8eef9;--mut:#8b9bb9;--mut2:#6f7f9d;
--ok:#35e0a1;--okbg:rgba(53,224,161,.12);--warn:#ff6f8a;--warnbg:rgba(255,111,138,.12);--amber:#ffc24a;--amberbg:rgba(255,194,74,.12);--blue:#7eb4ff;--bluebg:rgba(126,180,255,.12);
--gA:linear-gradient(180deg,#3fe8a8,#16b571);--gB:linear-gradient(180deg,#76a8ff,#4f73f2);--gC:linear-gradient(180deg,#ffcf5c,#f39c1c);
--r:12px;--pl-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 10px 24px -16px rgba(0,0,0,.9);

html{-webkit-text-size-adjust:100%;scroll-padding-top:56px}

 background:radial-gradient(560px 260px at 88% -70px,rgba(var(--sp-rgb),.20),transparent 72%),radial-gradient(460px 260px at -12% 14%,rgba(139,92,246,.07),transparent 70%),#070c16;background-repeat:no-repeat;overflow-x:hidden}

/* ---------- header: brand row, title, freshness, pinned nav ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:0!important;background:linear-gradient(180deg,rgba(var(--sp-rgb),.16),rgba(7,12,22,.96) 78%),#070c16!important;border:0;border-bottom:1px solid var(--line)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar::after{height:2px!important;background:linear-gradient(90deg,var(--sp),var(--sp2) 60%,transparent)!important;opacity:.9}

.pl-brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:0 0 9px;border-bottom:1px solid rgba(255,255,255,.07)}

.pl-dot{width:8px;height:8px;border-radius:50%;background:var(--fc,var(--mut));box-shadow:0 0 0 3px color-mix(in srgb,var(--fc,#888) 22%,transparent);flex:0 0 auto;display:inline-block}

.hmeta{color:var(--mut)!important;font-size:12px!important;line-height:1.45}

  var eps=[];[].forEach.call(D.querySelectorAll('.card .u'),function(u){var x=parseUpd(u.textContent);if(x)eps.push(x)});
  if(eps.length)return Math.max.apply(null,eps);
  return DATA.fallback?DATA.fallback*1000:null}
function paint(){
  if(!chip)return;var e=pageEpoch();if(e)epoch=e;if(!epoch)return;
  var age=Date.now()-epoch,s=stateOf(age);
  chip.setAttribute('data-s',s[0]);setT(chipB,s[1]);setT(chipI,stamp(epoch)+' · '+ago(age));
  chip.title='Page data updated '+DAY.format(new Date(epoch))+' '+TIME.format(new Date(epoch))+' CT';
  var f=D.querySelector('[data-pl-upd]');setT(f,stamp(epoch));
  /* home cards: per-card freshness dot */
  if(home)[].forEach.call(D.querySelectorAll('.card .u'),function(u){var x=parseUpd(u.textContent);if(!x)return;var d=u.querySelector('.pl-dot');if(!d){d=D.createElement('span');d.className='pl-dot';u.insertBefore(d,u.firstChild)}
    var st=stateOf(Date.now()-x)[0];d.style.setProperty('--fc',st==='ok'?'var(--ok)':st==='warn'?'var(--amber)':'var(--warn)');d.style.background='var(--fc)'});
}

/* 2. numeric columns right-aligned (tabular numerals for odds / percentages) */
var NUM=/^[+\-\u2212]?\$?\d[\d.,:]*\s*(%|pts?|u|x|m)?$/i;
function align(){
  [].forEach.call(D.querySelectorAll('table'),function(t){
    var rows=t.rows,n=rows.length;if(n<3||t.getAttribute('data-pl')===String(n))return;
    var head=t.tHead&&t.tHead.rows.length?t.tHead.rows[t.tHead.rows.length-1]:rows[0],nc=head.cells.length,c,r,col=[];
    for(c=1;c<nc;c++){var tot=0,num=0;for(r=0;r<n&&tot<60;r++){var row=rows[r];if(row===head||row.cells.length!==nc)continue;var tx=row.cells[c].textContent.replace(/\s+/g,' ').trim();if(!tx||tx==='-'||tx==='\u2014')continue;tot++;if(NUM.test(tx))num++}
      if(tot>=3&&num/tot>=.75)col.push(c)}
    col.forEach(function(c){for(var r=0;r<n;r++){var row=rows[r];if(row.cells.length===nc)row.cells[c].classList.add('pl-n')}});
    t.setAttribute('data-pl',String(n));
  })}

/* 3. footer */
function footer(){
  if(D.querySelector('.pl-foot'))return;
  var f=D.createElement('footer');f.className='pl-foot';
  f.innerHTML='<div class="pl-fl">'+LOGO.replace('width="24" height="24"','width="18" height="18"').replace('id="plg"','id="plg2"').replace('url(#plg)','url(#plg2)')+'Model Desk <span>Sports analytics</span></div>'+
   '<p>Probabilities, fair prices and projected scores are model estimates for information and entertainment. They are not financial or betting advice, and no outcome is ever certain. Prices come from public odds feeds, move quickly and can differ at your book, so confirm before you wager.</p>'+
   '<p>Independent project. Not affiliated with or endorsed by any league, team or sportsbook. Must be 21+ where wagering is legal. Help is available at 1-800-GAMBLER.</p>'+
   '<div class="pl-fm"><span><i class="pl-dot" style="--fc:var(--ok);background:var(--fc)"></i>Page data <span data-pl-upd>\u2014</span></span><span>Times Central (CT)</span><span><b class="g gA grade A">A</b> strong <b class="g gB grade B">B</b> solid <b class="g gC grade C">C</b> thin pick grade</span></div>';
  B.appendChild(f);
  /* keep the footer after the page content, before the scripts */
  var first=B.querySelector(':scope>script');if(first)B.insertBefore(f,first);
}

/* 4. keep only the sport nav pinned (title/brand row scrolls away) */
function pin(){var t=D.querySelector('.topbar'),i=t&&t.querySelector('.in');if(!t||!i||home)return;t.style.top=(-i.offsetHeight)+'px';
  var a=t.querySelector('nav.sports a.on'),n=t.querySelector('nav.sports');if(a&&n&&!n.dataset.pl){n.dataset.pl=1;n.scrollLeft=Math.max(0,a.offsetLeft-(n.clientWidth-a.offsetWidth)/2)}}

try{header();footer();B.classList.add('pl-js');paint();align();pin()}catch(e){if(W.console)console.warn('polish',e)}
var tm=null;function later(){clearTimeout(tm);tm=setTimeout(function(){try{header();align();paint();pin()}catch(e){}},250)}
if(W.MutationObserver)new MutationObserver(later).observe(B,{childList:true,subtree:true});
[400,1500,4000].forEach(function(ms){setTimeout(function(){try{paint();pin()}catch(e){}},ms)});
W.addEventListener('load',function(){try{pin();paint()}catch(e){}});W.addEventListener('resize',function(){try{pin()}catch(e){}});
setInterval(function(){try{paint()}catch(e){}},30000);
})();

</script><script id="skin-js">
/* dashboards skin v1: presentation only. Never changes data, only classes / wrappers / colour spans. */
(function(){
'use strict';
var D=document,B=D.body,SP=B.getAttribute('data-sport')||'';
var TITLES={'nfl':'All games & lines','nfl-props':'All props','nfl-td':'All players','cfb':'All games & lines','mlb':'All games & edges','nhl':'All edges, games & goalies','nhl-props':'All player points','tennis':'All matches','nba-props':'All props'};
function store(k,v){try{if(v===undefined)return sessionStorage.getItem('skin:'+location.pathname+':'+k);sessionStorage.setItem('skin:'+location.pathname+':'+k,v)}catch(e){return null}}

/* 1. colour words and signed values (over/under green/red, edge green/red) */
var OU=/\b(over|under)\b/i,SV=/^[+\-\u2212]\d+(\.\d+)?\s*(pts|%)$/;
function colourise(root){
  var sel=root.querySelectorAll?root.querySelectorAll('.pick,td,.sub td'):[];
  if(root.matches&&root.matches('td,.pick'))sel=[root];
  for(var i=0;i<sel.length;i++){
    var el=sel[i];
    if(el.classList.contains('num')&&!el.dataset.sv){var t=el.textContent.trim();el.dataset.sv=1;if(SV.test(t))el.classList.add(t.charAt(0)==='+'?'sv-pos':'sv-neg')}
    if(el.dataset.ou)continue;
    var w=D.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n,list=[];
    while((n=w.nextNode())){if(OU.test(n.nodeValue)&&!(n.parentNode.classList&&n.parentNode.classList.contains('ou')))list.push(n)}
    list.forEach(function(n){
      var parts=n.nodeValue.split(/\b(over|under)\b/i),f=D.createDocumentFragment();
      parts.forEach(function(p){
        if(/^(over|under)$/i.test(p)){var s=D.createElement('span');s.className='ou '+p.toLowerCase();s.textContent=p;f.appendChild(s)}
        else if(p)f.appendChild(D.createTextNode(p))});
      n.parentNode.replaceChild(f,n)});
    el.dataset.ou=1;
  }
}

/* 2. collapsible sections (each .sec-h and everything up to the next one) */
function rows(el){return el.querySelectorAll('tr').length}
function sections(){
  var main=D.querySelector('main.wrap');if(!main)return;
  var kids=[].slice.call(main.children),tabs=null,i;
  for(i=0;i<kids.length;i++)if(kids[i].classList.contains('tabs')){tabs=kids[i];break}
  if(tabs){
    var prev=null;for(i=kids.indexOf(tabs)-1;i>=0;i--)if(kids[i].classList.contains('sec-h')){prev=kids[i];break}
    if(!prev||/top (plays|props)/i.test(prev.textContent)){
      var h=D.createElement('div');h.className='sec-h';h.textContent=TITLES[SP]||'Full board';main.insertBefore(h,tabs)}
  }
  kids=[].slice.call(main.children);
  var heads=kids.filter(function(e){return e.classList.contains('sec-h')});
  heads.forEach(function(h,idx){
    var sec=D.createElement('section'),body=D.createElement('div'),n=h.nextSibling;
    sec.className='sec';body.className='sec-b';
    main.insertBefore(sec,h);sec.appendChild(h);sec.appendChild(body);
    while(n&&!(n.nodeType===1&&n.classList.contains('sec-h'))){var nx=n.nextSibling;body.appendChild(n);n=nx}
    var nrows=rows(body),isTop=/top (plays|props)/i.test(h.textContent),key=h.firstChild?h.firstChild.textContent.trim():('s'+idx);
    if(isTop)return;
    sec.classList.add('tog');
    if(nrows>12){var c=D.createElement('span');c.className='cnt';c.textContent=nrows+' rows';h.appendChild(c)}
    var saved=store(key),closed=saved===null?nrows>45:saved==='1';
    if(closed)sec.classList.add('closed');
    h.addEventListener('click',function(e){if(e.target.closest('a,button,select,input'))return;var c=sec.classList.toggle('closed');store(key,c?'1':'0')});
  });
}

/* 3. game cards: tap to expand tables / long injury lines */
function gcards(){
  var cards=[].slice.call(D.querySelectorAll('.gcard'));
  cards.forEach(function(c,i){
    [].forEach.call(c.querySelectorAll('.meta'),function(m){if(/^Injur/i.test(m.textContent)){m.classList.add('inj');m.addEventListener('click',function(){m.classList.toggle('open')})}});
    var p=c.querySelector('.panel');if(!p)return;
    c.classList.add('tog');var key='g'+i+(c.querySelector('h3')?c.querySelector('h3').textContent:''),sv=store(key);
    if(sv===null?(cards.length>3&&i>0):sv==='1')c.classList.add('closed');
    c.querySelector('h3').addEventListener('click',function(){var x=c.classList.toggle('closed');store(key,x?'1':'0')});
  });
}

/* 4. keep only the sport nav pinned: the title row scrolls away */
function pin(){
  var t=D.querySelector('.topbar'),i=t&&t.querySelector('.in');if(!t||!i)return;
  var set=function(){t.style.top=(-i.offsetHeight)+'px'};set();addEventListener('resize',set);addEventListener('load',set);
  var a=t.querySelector('nav.sports a.on'),n=t.querySelector('nav.sports');
  if(a&&n)n.scrollLeft=Math.max(0,a.offsetLeft-(n.clientWidth-a.offsetWidth)/2);
}

var busy=false,mo;
function run(){colourise(D.body)}
try{sections();gcards();run();pin()}catch(e){if(window.console)console.warn('skin',e)}
if(window.MutationObserver){
  var pend=false;
  mo=new MutationObserver(function(){if(busy||pend)return;pend=true;requestAnimationFrame(function(){pend=false;busy=true;try{colourise(D.body)}catch(e){}busy=false})});
  mo.observe(D.body,{childList:true,subtree:true});
}
})();

</script></body></html>
