<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tennis model</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><style>
:root{color-scheme:dark;--bg:#0b0f14;--bg2:#10161e;--card:#141c26;--card2:#1a2430;--line:#243040;--ink:#e8edf2;--mut:#8796a8;--acc:#4f9dff;
--ok:#3ddc97;--okbg:rgba(61,220,151,.13);--warn:#ff7b72;--warnbg:rgba(255,123,114,.13);--amber:#f5b942;--amberbg:rgba(245,185,66,.13);--blue:#6cb2ff;--bluebg:rgba(108,178,255,.13)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}h2,h3{font-weight:650}h3{font-size:14px;margin:16px 0 6px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(11,15,20,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1200px;margin:0 auto;padding:9px 14px 2px}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand h1{font-size:18px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
.hmeta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:12.5px}.hmeta span:empty{display:none}
nav.sports{display:flex;gap:6px;overflow-x:auto;max-width:1200px;margin:0 auto;padding:6px 14px 9px;scrollbar-width:none}nav.sports::-webkit-scrollbar{display:none}
nav.sports a{flex:0 0 auto;padding:4px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);text-decoration:none;font-size:13px}
nav.sports a.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
main.wrap{max-width:1200px;margin:0 auto;padding:10px 14px 40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:16px 0 8px;font-weight:600}
.sec-h small{text-transform:none;letter-spacing:0;font-weight:400}
.alert{margin:10px 0;padding:9px 12px;border-radius:10px;border:1px solid var(--amber);background:var(--amberbg);color:var(--ink);font-size:13px}.alert b{color:var(--amber)}
.alert.bad{border-color:var(--warn);background:var(--warnbg)}.alert.bad b{color:var(--warn)}
.status-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--amberbg);color:var(--amber)}
.plays{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.plays{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1000px){.plays{grid-template-columns:repeat(3,minmax(0,1fr))}}
.play{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.play .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.play .badges{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.play .pick{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}.play .game{color:var(--mut);font-size:12.5px;margin-top:1px}
.play .nums{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:9px;font-size:13.5px;font-variant-numeric:tabular-nums}
.play .k{color:var(--mut);font-size:11.5px;margin-right:3px}.play .bk{color:var(--mut);font-size:12px}
.play .note{color:var(--mut);font-size:12px;margin-top:7px;line-height:1.4}
.empty{color:var(--mut);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.edge{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.edge.pos{background:var(--okbg);color:var(--ok)}.edge.neg{background:var(--warnbg);color:var(--warn)}.edge.sus{background:var(--amberbg);color:var(--amber)}.edge.neu{background:var(--card2);color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 8px;padding:3px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs .tab,.tabs button{flex:0 0 auto;padding:6px 12px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs .tab.on,.tabs button.on{background:var(--card2);color:var(--ink);font-weight:600}
.panel,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:2px 0 10px}.tools label{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
select,input,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
input[type=checkbox]{padding:0;accent-color:var(--acc)}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);color:var(--mut);font-size:11.5px;font-weight:600;white-space:nowrap;user-select:none;cursor:pointer}th:hover{color:var(--ink)}
tr:nth-child(even)>td{background:rgba(255,255,255,.028)}tr.bet>td,tr.row>td{white-space:nowrap}tr.bet,tr.row{cursor:pointer}tr.bet:hover>td,tr.row:hover>td{background:rgba(79,157,255,.08)}
tr.detail>td,tr.sub>td{background:var(--bg2);font-size:12.5px;color:var(--mut)}tr.detail b,tr.sub b{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--card2);color:var(--mut)}
.pill.SUSPECT,.pill.INJ-UNKNOWN{background:var(--warnbg);color:var(--warn)}.pill.HOLD,.pill.LOWCONF,.pill.MODEL-ONLY-LOWCONF,.pill.LOW-FLAGGED{background:var(--amberbg);color:var(--amber)}
.pill.FORWARD-TEST{background:var(--bluebg);color:var(--blue)}
.grade{display:inline-block;min-width:22px;text-align:center;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;cursor:help}
.grade.A{background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,151,.45)}.grade.B{background:var(--amberbg);color:var(--amber);border:1px solid rgba(245,185,66,.45)}.grade.C{background:var(--warnbg);color:var(--warn);border:1px solid rgba(255,123,114,.45)}.grade.NA{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:11px;white-space:nowrap;cursor:help}
.flag{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border-radius:6px;background:var(--amberbg);color:var(--amber);font-size:11.5px}
.legend{margin:4px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mut);font-size:12px}.legend .row{margin:3px 0}
.legend summary{cursor:pointer}
.ok{color:var(--ok)}.deg,.warn{color:var(--amber)}.bad,.fail{color:var(--warn)}.mut,.muted,.info{color:var(--mut)}.neg{color:var(--warn)}.pos{color:var(--ok)}
.small,small{font-size:12px}small{color:var(--mut)}.mk{font-size:11px;font-weight:700;color:var(--mut)}
ul.tight{margin:4px 0 0 18px;padding:0}ul.tight li{margin:2px 0}
details.info{margin:26px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--mut);font-size:12.5px}
details.info>summary{cursor:pointer;color:var(--mut);font-size:12.5px}details.info[open]>summary{margin-bottom:8px}
details.info .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:8px 0}
details.info .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
details.info .card h2{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
details.info p,details.info .para{margin:4px 0}
#slate-line{background:var(--bg2)!important;color:var(--mut)!important;font:500 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif!important;padding:4px 14px!important;border-bottom:1px solid var(--line)!important}

.sec-h{flex-wrap:wrap}
footer.foot{max-width:1200px;margin:0 auto;padding:0 14px 28px;color:var(--mut);font-size:12px}

$('div',{class:'small'},'Elo (surface-adjusted) A '+f(m.elo_a,0)+' / B '+f(m.elo_b,0)+' | rank A '+(m.rank_a||'?')+' / B '+(m.rank_b||'?')+' | Elo-only P(A) '+pc(m.p_elo,0)+' | point-sim P(A) '+pc(m.p_sim,0)+' | serve-pt prob A '+pc(m.serve_a,1)+' B '+pc(m.serve_b,1)+' | best-of '+m.best_of+' | H2H meetings '+m.h2h),
$('div',{class:'small'},'Likely set scores (A-B): '+ss+' | total games mean '+f(m.total_mean,1)+' sd '+f(m.total_sd,1)+' median '+m.total_median+' | model line '+m.total_line_model+' P(over) '+pc(m.p_over_model,0)),
$('div',{class:'small'},'Rest days A '+m.rest_a+' B '+m.rest_b+' | minutes last 7d A '+Math.round(m.mins7_a)+' B '+Math.round(m.mins7_b)+' | matches in history A '+m.n_a+' B '+m.n_b),
m.market?$('div',{class:'small'},'Market: '+m.market.book+(m.market.pulled_at?' (pulled '+UI.ct(m.market.pulled_at)+')':'')+' decimal A '+f(m.market.dec_a)+' B '+f(m.market.dec_b)+(m.market.total_line!=null?' | total line '+m.market.total_line:'')+(m.total_market_line!=null?' | model P(over) '+pc(m.total_p_over,0):'')):$('div',{class:'small mut',text:'No market price available for this match.'}),
m.p_a!=null?$('div',{class:'small'},$('b',{text:'Pick grade: '}),gradeBadge(m),' '+(m.pick_grade?pickTip(m)+'. '+((D.pick_help||{})[m.pick_grade]||''):'')+(m.ns_a!=null?' | matches on '+(m.surface||'?')+': A '+m.ns_a+', B '+m.ns_b+' (career: A '+m.n_a+', B '+m.n_b+')':'')):null,
$('div',{class:'small '+(m.flags&&m.flags.length?'warn':'mut')},'Flags: '+((m.flags||[]).join('; ')||'none')),m.notes&&m.notes.length?$('div',{class:'small mut',text:'Notes: '+m.notes.join('; ')}):null)))}}

function pickTip(m){return m.pick_edge==null?'':((m.pick_edge>=0?'+':'')+m.pick_edge.toFixed(1)+' pts over break-even, EV '+(m.pick_ev>=0?'+':'')+m.pick_ev.toFixed(1)+'%')}
function srcTxt(m){const mk=m.market||{};if(!m.market)return '';const src=mk.source_label||'';
if(mk.source==='rapidapi')return src+' \u00b7 '+(mk.fair_ref||'')+' \u00b7 best of '+mk.n_books+' books'+(m.best_book?' ('+m.best_book+')':'')+(mk.pulled_at?' \u00b7 pulled '+UI.ct(mk.pulled_at):'');
