<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><style>

a{color:var(--blue)}h2,h3{font-weight:650}h3{font-size:14px;margin:16px 0 6px}

.hmeta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:12.5px}.hmeta span:empty{display:none}

.panel,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:2px 0 10px}.tools label{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
select,input,button{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--ink)}
input[type=checkbox]{padding:0;accent-color:var(--acc)}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--card2);color:var(--mut);font-size:11.5px;font-weight:600;white-space:nowrap;user-select:none;cursor:pointer}th:hover{color:var(--ink)}
tr:nth-child(even)>td{background:rgba(255,255,255,.028)}tr.bet>td,tr.row>td{white-space:nowrap}tr.bet,tr.row{cursor:pointer}tr.bet:hover>td,tr.row:hover>td{background:rgba(79,157,255,.08)}

td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--card2);color:var(--mut)}
.pill.SUSPECT,.pill.INJ-UNKNOWN{background:var(--warnbg);color:var(--warn)}.pill.HOLD,.pill.LOWCONF,.pill.MODEL-ONLY-LOWCONF,.pill.LOW-FLAGGED{background:var(--amberbg);color:var(--amber)}
.pill.FORWARD-TEST{background:var(--bluebg);color:var(--blue)}
.grade{display:inline-block;min-width:22px;text-align:center;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;cursor:help}
.grade.A{background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,151,.45)}.grade.B{background:var(--amberbg);color:var(--amber);border:1px solid rgba(245,185,66,.45)}.grade.C{background:var(--warnbg);color:var(--warn);border:1px solid rgba(255,123,114,.45)}.grade.NA{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:999px;background:var(--card2);color:var(--mut);font-size:11px;white-space:nowrap;cursor:help}
.flag{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border-radius:6px;background:var(--amberbg);color:var(--amber);font-size:11.5px}
.legend{margin:4px 0 10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mut);font-size:12px}.legend .row{margin:3px 0}
.legend summary{cursor:pointer}
.ok{color:var(--ok)}.deg,.warn{color:var(--amber)}.bad,.fail{color:var(--warn)}.mut,.muted,.info{color:var(--mut)}.neg{color:var(--warn)}.pos{color:var(--ok)}
.small,small{font-size:12px}small{color:var(--mut)}.mk{font-size:11px;font-weight:700;color:var(--mut)}
ul.tight{margin:4px 0 0 18px;padding:0}ul.tight li{margin:2px 0}
details.info{margin:26px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--mut);font-size:12.5px}
details.info>summary{cursor:pointer;color:var(--mut);font-size:12.5px}details.info[open]>summary{margin-bottom:8px}
details.info .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:8px 0}

.sec-h{flex-wrap:wrap}

/* ===== Model Desk polish v1 : institutional / terminal refinement layer. Loaded LAST. Presentation only. ===== */
:root{
--bg:#070c16;--bg2:#0b1220;--card:#0f1727;--card2:#151f35;--line:#1f2c47;--line2:#2a3b5e;--ink:#e8eef9;--mut:#8b9bb9;--mut2:#6f7f9d;
--ok:#35e0a1;--okbg:rgba(53,224,161,.12);--warn:#ff6f8a;--warnbg:rgba(255,111,138,.12);--amber:#ffc24a;--amberbg:rgba(255,194,74,.12);--blue:#7eb4ff;--bluebg:rgba(126,180,255,.12);
--gA:linear-gradient(180deg,#3fe8a8,#16b571);--gB:linear-gradient(180deg,#76a8ff,#4f73f2);--gC:linear-gradient(180deg,#ffcf5c,#f39c1c);
--r:12px;--pl-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 10px 24px -16px rgba(0,0,0,.9);
--pl-font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body[data-sport="home"]{--sp:#6d8dff;--sp2:#a46bff;--sp-rgb:109,141,255}
html{-webkit-text-size-adjust:100%;scroll-padding-top:56px}
body{font-family:var(--pl-font)!important;font-size:14.5px;line-height:1.5;letter-spacing:-.003em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:var(--ink);
 background:radial-gradient(560px 260px at 88% -70px,rgba(var(--sp-rgb),.20),transparent 72%),radial-gradient(460px 260px at -12% 14%,rgba(139,92,246,.07),transparent 70%),#070c16;background-repeat:no-repeat;overflow-x:hidden}
button,input,select,textarea,table,.dtabs a,.dtabs button,nav.sports a,.tabs .tab{font-family:var(--pl-font)!important}
::selection{background:rgba(var(--sp-rgb),.35)}
a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--sp);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:#2a3b5e transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header: brand row, title, freshness, pinned nav ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:0!important;background:linear-gradient(180deg,rgba(var(--sp-rgb),.16),rgba(7,12,22,.96) 78%),#070c16!important;border:0;border-bottom:1px solid var(--line)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar::after{height:2px!important;background:linear-gradient(90deg,var(--sp),var(--sp2) 60%,transparent)!important;opacity:.9}
.topbar .in{padding:10px 16px 4px!important;max-width:1200px;margin:0 auto}
.pl-brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:0 0 9px;border-bottom:1px solid rgba(255,255,255,.07)}
.pl-brand{flex:0 0 auto;white-space:nowrap;display:flex;align-items:center;gap:9px;color:#fff!important;text-decoration:none;min-width:0}
.pl-brand svg{flex:0 0 auto;display:block;filter:drop-shadow(0 4px 10px rgba(80,120,255,.45))}
.pl-wm{display:flex;flex-direction:column;line-height:1.05}
.pl-wm b{font-size:13.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.pl-wm b em{font-style:normal;font-weight:500;color:#9fb3da;margin-left:.35em}
.pl-wm i{font-style:normal;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin-top:3px}
.pl-fresh{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 9px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);flex:0 1 auto;min-width:0;--fc:var(--mut)}
.pl-fresh[data-s=ok]{--fc:var(--ok)}.pl-fresh[data-s=warn]{--fc:var(--amber)}.pl-fresh[data-s=old]{--fc:var(--warn)}
.pl-dot{width:8px;height:8px;border-radius:50%;background:var(--fc,var(--mut));box-shadow:0 0 0 3px color-mix(in srgb,var(--fc,#888) 22%,transparent);flex:0 0 auto;display:inline-block}
.pl-fresh[data-s=ok] .pl-dot{animation:pl-pulse 2.4s ease-in-out infinite}
@keyframes pl-pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--fc) 22%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--fc) 6%,transparent)}}
.pl-ft{display:flex;flex-direction:column;line-height:1.15;text-align:right}
.pl-ft b{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--fc,var(--mut))}
.pl-ft{min-width:0}.pl-ft i{font-style:normal;font-size:11.5px;font-weight:600;color:#cbd6ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1,header h1{font-size:22px;font-weight:750;letter-spacing:-.022em;line-height:1.15;color:#fff!important;background:none!important;-webkit-text-fill-color:#fff!important;margin:0}
.hmeta{color:var(--mut)!important;font-size:12px!important;line-height:1.45}
body.pl-js #updated,.pl-hide{display:none!important}
header.topbar{margin:0}
header.topbar>nav.sports{max-width:1200px;margin:0 auto}
nav.sports{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:8px 14px 10px!important}
nav.sports::-webkit-scrollbar{display:none}
nav.sports a{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 11px!important;border-radius:9px!important;background:rgba(255,255,255,.035)!important;border:1px solid rgba(255,255,255,.08)!important;color:#c3d0e8!important;font-size:12.5px!important;font-weight:600!important;letter-spacing:.005em;text-decoration:none;text-shadow:none!important;box-shadow:none!important;transition:background .15s,border-color .15s}

nav.sports a.on i{background:#fff!important}
nav.sports a[data-k=home] i{background:#9fb3da!important}

/* today / tomorrow */
.dtabs{margin:12px 14px 0!important;padding:3px!important;background:var(--bg2)!important;border:1px solid var(--line)!important;border-radius:11px!important}
.dtabs a,.dtabs button{border-radius:8px!important;font-size:13px!important;font-weight:650!important;letter-spacing:0;padding:9px 6px!important}

.dnote{border-radius:10px!important;background:rgba(var(--sp-rgb),.09)!important;border:1px solid rgba(var(--sp-rgb),.28)!important;color:#d6e0f4!important;font-size:12.5px!important}

/* ---------- section headers ---------- */
.sec-h{margin:24px 0 10px!important;padding:0 0 8px 11px!important;border-bottom:1px solid var(--line);font-size:11.5px!important;font-weight:750!important;letter-spacing:.12em!important;text-transform:uppercase;color:#d9e2f4!important;align-items:center}
.sec-h::before{top:1px!important;bottom:9px!important;width:3px!important;border-radius:2px!important}

/* ---------- card system ---------- */

.play{background:linear-gradient(160deg,rgba(var(--sp-rgb),.07),transparent 55%),var(--card)!important;border-left:3px solid var(--gc,var(--sp))!important;padding:13px 14px 12px!important}

/* ---------- grade badges: one system (A emerald / B blue / C amber) ---------- */

.grade.C,.gd-g.C,.pd-g.C{background:var(--gC)!important;color:#3a2000!important}

/* ---------- tables: aligned, tabular, quiet ---------- */
table{font-size:12.5px!important;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

var TITLES={'nfl':'All games & lines','nfl-props':'All props','nfl-td':'All players','cfb':'All games & lines','mlb':'All games & edges','nhl':'All edges, games & goalies','nhl-props':'All player points','tennis':'All matches','nba-props':'All props'};
function store(k,v){try{if(v===undefined)return sessionStorage.getItem('skin:'+location.pathname+':'+k);sessionStorage.setItem('skin:'+location.pathname+':'+k,v)}catch(e){return null}}

/* 1. colour words and signed values (over/under green/red, edge green/red) */
var OU=/\b(over|under)\b/i,SV=/^[+\-\u2212]\d+(\.\d+)?\s*(pts|%)$/;
function colourise(root){
  var sel=root.querySelectorAll?root.querySelectorAll('.pick,td,.sub td'):[];
  if(root.matches&&root.matches('td,.pick'))sel=[root];
  for(var i=0;i<sel.length;i++){
    var el=sel[i];
    if(el.classList.contains('num')&&!el.dataset.sv){var t=el.textContent.trim();el.dataset.sv=1;if(SV.test(t))el.classList.add(t.charAt(0)==='+'?'sv-pos':'sv-neg')}
    if(el.dataset.ou)continue;
    var w=D.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n,list=[];
    while((n=w.nextNode())){if(OU.test(n.nodeValue)&&!(n.parentNode.classList&&n.parentNode.classList.contains('ou')))list.push(n)}
    list.forEach(function(n){
      var parts=n.nodeValue.split(/\b(over|under)\b/i),f=D.createDocumentFragment();
      parts.forEach(function(p){
        if(/^(over|under)$/i.test(p)){var s=D.createElement('span');s.className='ou '+p.toLowerCase();s.textContent=p;f.appendChild(s)}
        else if(p)f.appendChild(D.createTextNode(p))});
      n.parentNode.replaceChild(f,n)});
    el.dataset.ou=1;
  }
}

/* 2. collapsible sections (each .sec-h and everything up to the next one) */
function rows(el){return el.querySelectorAll('tr').length}
function sections(){
  var main=D.querySelector('main.wrap');if(!main)return;
  var kids=[].slice.call(main.children),tabs=null,i;
  for(i=0;i<kids.length;i++)if(kids[i].classList.contains('tabs')){tabs=kids[i];break}
  if(tabs){
    var prev=null;for(i=kids.indexOf(tabs)-1;i>=0;i--)if(kids[i].classList.contains('sec-h')){prev=kids[i];break}
    if(!prev||/top (plays|props)/i.test(prev.textContent)){
      var h=D.createElement('div');h.className='sec-h';h.textContent=TITLES[SP]||'Full board';main.insertBefore(h,tabs)}
  }
  kids=[].slice.call(main.children);
  var heads=kids.filter(function(e){return e.classList.contains('sec-h')});
  heads.forEach(function(h,idx){
    var sec=D.createElement('section'),body=D.createElement('div'),n=h.nextSibling;
    sec.className='sec';body.className='sec-b';
    main.insertBefore(sec,h);sec.appendChild(h);sec.appendChild(body);
    while(n&&!(n.nodeType===1&&n.classList.contains('sec-h'))){var nx=n.nextSibling;body.appendChild(n);n=nx}
    var nrows=rows(body),isTop=/top (plays|props)/i.test(h.textContent),key=h.firstChild?h.firstChild.textContent.trim():('s'+idx);
    if(isTop)return;
    sec.classList.add('tog');
    if(nrows>12){var c=D.createElement('span');c.className='cnt';c.textContent=nrows+' rows';h.appendChild(c)}
    var saved=store(key),closed=saved===null?nrows>45:saved==='1';
    if(closed)sec.classList.add('closed');
    h.addEventListener('click',function(e){if(e.target.closest('a,button,select,input'))return;var c=sec.classList.toggle('closed');store(key,c?'1':'0')});
  });
}

/* 3. game cards: tap to expand tables / long injury lines */
function gcards(){
  var cards=[].slice.call(D.querySelectorAll('.gcard'));
  cards.forEach(function(c,i){
    [].forEach.call(c.querySelectorAll('.meta'),function(m){if(/^Injur/i.test(m.textContent)){m.classList.add('inj');m.addEventListener('click',function(){m.classList.toggle('open')})}});
    var p=c.querySelector('.panel');if(!p)return;
    c.classList.add('tog');var key='g'+i+(c.querySelector('h3')?c.querySelector('h3').textContent:''),sv=store(key);
    if(sv===null?(cards.length>3&&i>0):sv==='1')c.classList.add('closed');
    c.querySelector('h3').addEventListener('click',function(){var x=c.classList.toggle('closed');store(key,x?'1':'0')});
  });
}

/* 4. keep only the sport nav pinned: the title row scrolls away */
function pin(){
  var t=D.querySelector('.topbar'),i=t&&t.querySelector('.in');if(!t||!i)return;
  var set=function(){t.style.top=(-i.offsetHeight)+'px'};set();addEventListener('resize',set);addEventListener('load',set);
  var a=t.querySelector('nav.sports a.on'),n=t.querySelector('nav.sports');
  if(a&&n)n.scrollLeft=Math.max(0,a.offsetLeft-(n.clientWidth-a.offsetWidth)/2);
}

var busy=false,mo;
function run(){colourise(D.body)}
try{sections();gcards();run();pin()}catch(e){if(window.console)console.warn('skin',e)}
if(window.MutationObserver){
  var pend=false;
  mo=new MutationObserver(function(){if(busy||pend)return;pend=true;requestAnimationFrame(function(){pend=false;busy=true;try{colourise(D.body)}catch(e){}busy=false})});
  mo.observe(D.body,{childList:true,subtree:true});
}
})();

</script></body></html>
