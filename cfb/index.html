function gradeBadge(b) { const g = b.data_grade; return $('span', { class: 'grade ' + (g || 'NA'), title: g ? 'Data grade ' + g + ': ' + ((D.grade_help || {})[g] || '') : 'INJ-UNKNOWN: no injury data from any source, so no data grade', text: g || '-' }); }

function legend() {
  const L = $('details', { class: 'legend small' }, $('summary', { text: 'What the labels and A/B/C data grades mean' }));
  L.append($('div', { class: 'row' }, $('b', { text: 'Model line ' }), 'is the sharp line: the market line moved by the share of the raw ratings gap that held up on 2022-25 games (sides ' + pct((D.params.sharp || {}).w_spread, 0) + ', totals ' + pct((D.params.sharp || {}).w_total, 0) + '). Edge = sharp line minus market. Cover/Over % = calibrated chance the pick wins at the listed line; rows are ranked by it.'));
  L.append($('div', { class: 'row' }, $('b', { text: 'LOW ' }), 'is the standard label for a model-vs-market gap; FORWARD-TEST marks a 6+ pt raw totals gap; SUSPECT marks a raw gap so large it is probably a data error.'));
  L.append($('div', { class: 'row' }, $('b', { text: 'Data grade ' }), '(A/B/C) is separate: how certain the injury/availability inputs are. It says nothing about edge size or who wins.'));
  for (const g of ['A', 'B', 'C']) L.append($('div', { class: 'row' }, $('span', { class: 'grade ' + g, text: g }), ' ' + ((D.grade_help || {})[g] || '')));
  L.append($('div', { class: 'row' }, $('span', { class: 'grade NA', text: '-' }), ' INJ-UNKNOWN: no injury data from any source; no grade, listed last.'));
  return L;
}

function detailRow(b, span) {
  const d = $('td', { colspan: span });
  d.append($('div', { class: 'small mut', text: 'Line source: ' + (b.market_source || 'n/a') + '; ' + b.books + ' book line(s); median price ' + b.price + (b.best_price != null ? '; best available ' + (b.best_price > 0 ? '+' : '') + Math.round(b.best_price) + ' at ' + b.best_book : '') + (b.novig_p != null ? '; market no-vig P(pick) ' + (100 * b.novig_p).toFixed(1) + '%' : '') + '. Injury coverage for this game: ' + (b.injury_coverage || 'unknown') + (b.conference_game ? ' (conference game)' : ' (non-conference: no official report exists)') + '.' }));
  if (b.raw_line != null) d.append($('div', { style: 'margin-top:6px' }, $('b', { text: 'Model: ' }), 'raw ratings line ' + fmt(b.raw_line) + '; model gap ' + fmt(b.raw_gap) + ' pts' + (b.market === 'SIDE' ? ' (after removing the ratings\' favourite/home lean)' : '') + '; sharp line ' + fmt(b.model_line) + ' = market + ' + (b.market === 'SIDE' ? pct((D.params.sharp || {}).w_spread, 0) : pct((D.params.sharp || {}).w_total, 0)) + ' of that gap' + (b.prob != null ? '; P(' + b.pick + ') ' + pct(b.prob) : '') + (b.win_p != null ? '; P(outright win) ' + pct(b.win_p) : '') + '.'));
  d.append($('div', { style: 'margin-top:6px' }, $('b', { text: 'Data grade: ' }), gradeBadge(b), ' ' + (b.data_grade ? (D.grade_help || {})[b.data_grade] || '' : 'No injury data from any source (INJ-UNKNOWN) - no grade.')));
  if (b.flags.length) d.append($('div', { style: 'margin-top:6px' }, $('b', { text: 'Flags (full text): ' }), ...b.flags.map(f => $('span', { class: 'flag', text: f }))));
  d.append($('div', { style: 'margin-top:6px' }, $('b', { text: 'Injuries used (' + b.injuries.length + '): ' }), b.injuries.length ? '' : 'none applied - injuries are NOT reflected unless listed here.'));
  if (b.injuries.length) { const ul = $('ul', { class: 'tight' }); for (const r of b.injuries) ul.append($('li', { text: r.team + ' - ' + r.player + ' (' + r.pos + ') ' + r.status + ' | source ' + r.source + ' (confidence ' + fmt(r.source_confidence, 2) + ')' + (r.matched_roster ? '' : ' | not matched to ESPN roster') })); d.append(ul); }
  if (b.adjustments.length) { d.append($('div', { style: 'margin-top:6px' }, $('b', { text: 'Points adjustments (injury priors): ' }))); const ul = $('ul', { class: 'tight' }); for (const a of b.adjustments) ul.append($('li', { text: a.team + ' ' + (a.side === 'off' ? 'offense' : 'defense') + ' ' + a.points + ' pts - ' + a.player + ' (' + a.pos + '), swap confidence ' + a.confidence })); d.append(ul); }
  if (b.swaps.length) { d.append($('div', { style: 'margin-top:6px' }, $('b', { text: 'Backup substitutions used: ' }))); const ul = $('ul', { class: 'tight' }); for (const s of b.swaps) ul.append($('li', { text: s.team + ' ' + s.pos + ': ' + s.out + ' -> ' + (s.replacement || 'UNIDENTIFIED') + ' via ' + s.method + ' [' + s.confidence + ']' + (s.flags.length ? ' - ' + s.flags.join('; ') : '') })); d.append(ul); }
  return $('tr', { class: 'detail' }, d);
}

function gamesPanel(P) {
  const rows = D.games.slice().sort(cmp(...state.sort.games));
  const cols = [['kickoff', 'Kickoff (CT)'], ['away', 'Away'], ['home', 'Home'], ['model_spread', 'Model home spread', 1], ['market_spread', 'Market home spread', 1], ['home_win_p', 'Home win %', 1], ['model_total', 'Model total', 1], ['market_total', 'Market total', 1], ['market_source', 'Line source'], ['injury_coverage', 'Injury coverage']];
  const tb = $('table'); const hr = $('tr');
  for (const [key, name, isn] of cols) { const th = $('th', { class: 'sortable' + (isn ? ' num' : ''), text: name + (state.sort.games[0] === key ? (state.sort.games[1] > 0 ? ' ▲' : ' ▼') : '') }); th.onclick = () => { state.sort.games = [key, state.sort.games[0] === key ? -state.sort.games[1] : 1]; draw(); }; hr.append(th); }
  tb.append(hr);
  for (const g of rows) tb.append($('tr', null, $('td', { text: g.kickoff_central }), $('td', { text: g.away }), $('td', { text: g.home + (g.neutral ? ' (N)' : '') }), $('td', { class: 'num', text: fmt(g.model_spread) }), $('td', { class: 'num', text: fmt(g.market_spread) }), $('td', { class: 'num', title: g.home_fair_ml != null ? 'fair ML: ' + g.home + ' ' + ml(g.home_fair_ml) + ' / ' + g.away + ' ' + ml(g.away_fair_ml) : null, text: pct(g.home_win_p) }), $('td', { class: 'num', text: fmt(g.model_total) }), $('td', { class: 'num', text: fmt(g.market_total) }), $('td', { class: 'small', text: g.market_source || '' }), $('td', { class: 'small mut', text: g.injury_coverage })));
  if (!rows.length) tb.append($('tr', null, $('td', { colspan: 10, class: 'mut', text: 'No modelled games in this run.' })));
  P.append(tb, $('div', { class: 'small mut', style: 'margin-top:6px', text: 'Spreads are from the HOME team\'s perspective (negative = home favoured). Model lines are the sharp lines (market + the share of the raw ratings gap that held up on 2022-25 games) and include any injury adjustment. Home win % = model chance the home team wins outright (hover for fair moneylines).' }));
}

function subsPanel(P) {
  if (!D.swaps.length) { P.append($('div', { class: 'mut', text: 'No backup substitutions in this run.' })); return; }
  const tb = $('table', null, $('tr', null, ...['Team', 'Pos', 'Out', 'Replacement', 'Method', 'Confidence', 'Flags'].map(h => $('th', { text: h }))));
  for (const s of D.swaps) tb.append($('tr', null, $('td', { text: s.team }), $('td', { text: s.pos }), $('td', { text: s.out }), $('td', { text: s.replacement || 'UNIDENTIFIED' }), $('td', { text: s.method }), $('td', { text: s.confidence }), $('td', { class: 'small mut', text: s.flags.join('; ') })));
  P.append(UI.sortTable(tb), $('div', { class: 'small mut', style: 'margin-top:6px', text: 'Depth charts are not available from any free source; replacements are inferred from recent box-score usage and flagged. OL replacements can never be identified.' }));
}

function healthPanel(P) {
  const tb = $('table', null, $('tr', null, $('th', { text: 'Source' }), $('th', { text: 'Status' })));
  for (const h of D.health) { const c = h.status.startsWith('ok') ? 'ok' : h.status.startsWith('degraded') ? 'deg' : h.status.startsWith('skipped') ? 'mut' : 'bad'; tb.append($('tr', null, $('td', { text: h.source }), $('td', { class: c, text: h.status }))); }
  if (!D.health.length) tb.append($('tr', null, $('td', { colspan: 2, class: 'bad', text: 'No source information (the run failed before any data was loaded).' })));
  const st = D.status || { state: 'ok' };
  UI.statusAlert(P, st, st.last_good_utc ? $('div', { class: 'small', text: 'Last good run: ' + st.last_good_utc + ' (UTC). Lines and injury news may have changed.' }) : null);
  P.append($('p', { class: 'small mut', text: oddsLine() }));
  P.append(tb);
  if (D.warnings.length) { P.append($('h3', { text: 'Warnings' })); const ul = $('ul', { class: 'tight' }); for (const w of D.warnings) ul.append($('li', { text: w })); P.append(ul); }
}

function sel(opts, val, cb) { const s = $('select'); for (const o of opts) { const e = $('option', { value: o, text: o }); if (o === val) e.selected = true; s.append(e); } s.onchange = () => cb(s.value); return s; }
function num(val, cb) { const i = $('input', { type: 'number', step: '0.5', min: '0', style: 'width:70px', value: val }); i.oninput = () => cb(parseFloat(i.value) || 0); return i; }
function txt(val, cb) { const i = $('input', { type: 'text', placeholder: 'team or pick', value: val, id: 'q' }); i.oninput = () => cb(i.value); return i; }
function $chk(val, cb) { const i = $('input', { type: 'checkbox' }); i.checked = val; i.onchange = () => cb(i.checked); return i; }

function draw(keepFocus) {
  const P = document.getElementById('panel'); const hadQ = keepFocus && document.activeElement && document.activeElement.id === 'q'; const pos = hadQ ? document.activeElement.selectionStart : 0;
  P.textContent = '';
  ({ bets: betsPanel, games: gamesPanel, subs: subsPanel, health: healthPanel })[state.tab](P);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === state.tab));
  if (hadQ) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
}

function footer() {
  const F = document.getElementById('foot'); F.textContent = '';
  F.append($('div', { text: 'Limits: points-only ratings (no PPA/SP+, transfers, weather); injuries from official conference reports for conference games, a partial third-party list for the rest, none for some games (INJ-UNKNOWN); no depth charts (backups inferred from box-score usage).' }));
  if (LIVE) {
    const btn = $('button', { text: 'Refresh now (re-runs the model, ~15-60 s)' }); const msg = $('span', { class: 'small mut', style: 'margin-left:8px' });
    btn.onclick = async () => { btn.disabled = true; msg.textContent = 'running...'; try { const r = await fetch('../refresh', { method: 'POST' }); const j = await r.json(); msg.textContent = j.message || 'done'; if (j.ok) setTimeout(() => location.reload(), 500); else btn.disabled = false; } catch (e) { msg.textContent = 'refresh failed: ' + e; btn.disabled = false; } };
    F.append($('div', { style: 'margin-top:8px' }, btn, msg));
  }
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.tab = t.dataset.tab; draw(); });
header(); topPlays(); draw(); footer();
UI.autoReload(300000);      // 5-minute auto-refresh of the published page
</script></body></html>
