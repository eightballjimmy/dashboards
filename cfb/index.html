select,input[type=text],input[type=number],button{font:inherit;padding:5px 8px;border:1px solid #cfd4dc;border-radius:6px;background:#fff}
button{cursor:pointer}button:hover{background:#f0f2f5}button:disabled{opacity:.5;cursor:default}

.pill.LOW{background:#eef0f3;color:#475467}.pill.FORWARD-TEST{background:var(--bluebg);color:var(--blue)}.pill.SUSPECT{background:var(--warnbg);color:var(--warn)}.pill.INJ-UNKNOWN{background:#fde7e7;color:#b42318;border:1px solid #b42318}
.mk{font-size:11px;font-weight:700;color:var(--mut)}
.ok{color:var(--ok)}.deg{color:var(--amber)}.bad{color:var(--warn)}.mut{color:var(--mut)}
tr.bet{cursor:pointer}tr.bet:hover{background:#fafbfc}tr.detail td{background:#fafbfc;font-size:13px}
.flag{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border-radius:6px;background:var(--amberbg);color:var(--amber);font-size:12px}
.grade{display:inline-block;min-width:22px;text-align:center;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;cursor:help}
.grade.A{background:var(--okbg);color:var(--ok);border:1px solid #abefc6}.grade.B{background:var(--amberbg);color:var(--amber);border:1px solid #fedf89}.grade.C{background:var(--warnbg);color:var(--warn);border:1px solid #fda29b}.grade.NA{background:#fff;color:var(--mut);border:1px dashed #cfd4dc}
.chip{display:inline-block;margin:1px 3px 1px 0;padding:0 7px;border-radius:999px;background:#f2f4f7;color:#344054;font-size:11px;white-space:nowrap;cursor:help}
.legend{margin:8px 0 10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fafbfc}
.legend .row{margin:3px 0}
.tabs{display:flex;gap:4px;margin:10px 0 0}.tab{padding:7px 14px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:#e9ecf0;cursor:pointer}
.tab.on{background:var(--card);font-weight:600}.panel{background:var(--card);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:12px 14px;overflow-x:auto}
.small{font-size:12px}.neg{color:var(--warn)}.pos{color:var(--ok)}
ul.tight{margin:4px 0 0 18px;padding:0}ul.tight li{margin:2px 0}
footer{color:var(--mut);font-size:12px;padding:0 24px 24px;max-width:1500px;margin:0 auto}
